<title>ปฏิบัติการเข็มทิศ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one dark tactical world — map/compass stage fills the screen, the mission HUD docks below on phones and to the right on wide screens */
:root{
  --bg:#0e120f; --surface:#151b16; --surface-2:#1d251e; --surface-3:#26302700; --ink:#e9eddf; --muted:#93a08b; --line:#2b362c;
  --accent:#f0b03a; --accent-ink:#1b1404; --accent-soft:#3a2e12;
  --good:#86d474; --bad:#ff6f5e; --star:#f0b03a; --star-off:#3a443a;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px 14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.brand em{font-style:normal;color:var(--accent)}
.rankchip{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font-size:13.5px}
.rankchip b{font-family:var(--f-display);font-weight:600}
.rankchip .st{color:var(--star);font-family:var(--f-mono);font-size:13px}
.mission{display:flex;align-items:center;gap:6px;margin-left:auto}
.mission label{font-size:12px;color:var(--muted)}
.mission input{width:7.5em;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-family:var(--f-mono);font-size:14px;text-transform:uppercase}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 12px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;padding:0}
.tabs{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 14px;font-size:14px;white-space:nowrap;font-family:var(--f-display);font-weight:600;letter-spacing:.02em}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stage{position:relative;min-height:0;overflow:hidden;background:#d9d3c0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#comp{position:absolute;inset:0;display:grid;grid-template-rows:36% 64%;touch-action:none;background:#11140f}
#comp canvas{width:100%;height:100%;display:block;touch-action:none}
.stagebar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.stagebar .btn{background:rgba(251,252,247,.92);color:#1b2117;border-color:rgba(0,0,0,.18);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.viewseg{position:absolute;left:10px;top:10px;z-index:2;display:flex;border-radius:8px;overflow:hidden;border:1px solid rgba(0,0,0,.25);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.viewseg button{border:0;padding:6px 12px;background:rgba(251,252,247,.92);color:#1b2117;font-size:14px}
.viewseg button[aria-pressed="true"]{background:#2f3b26;color:#f0b03a}
.turnbar{position:absolute;left:0;right:0;bottom:12px;padding-inline:12px;display:flex;justify-content:space-between;gap:10px;z-index:2;pointer-events:none}
.turnbar span{pointer-events:auto}
.turnbar .btn{pointer-events:auto;background:rgba(20,24,18,.85);color:#e8eadf;border-color:rgba(255,255,255,.2)}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:52px;font-size:12px;color:#c9cfbf;background:rgba(0,0,0,.5);padding:3px 10px;border-radius:999px;z-index:2;white-space:nowrap}
.compbar{position:absolute;right:10px;top:10px;z-index:2;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.compbar .seg{display:flex;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.compbar .seg button{border:0;padding:6px 10px;background:rgba(20,24,18,.85);color:#e8eadf;font-size:13.5px}
.compbar .seg button[aria-pressed="true"]{background:#2f3b26;color:#fff}
.compbar .bz{display:flex;gap:6px}
.compbar .bz .btn{background:rgba(20,24,18,.85);color:#e8eadf;border-color:rgba(255,255,255,.25);font-size:13.5px;padding:6px 10px}
.hint{top:auto!important;bottom:18px;white-space:normal!important;max-width:40%;text-align:center}
.flash{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .35s}
.flash.ok{background:radial-gradient(circle,transparent 55%,rgba(134,212,116,.45));opacity:1}
.flash.bad{background:radial-gradient(circle,transparent 55%,rgba(255,111,94,.45));opacity:1}

.sheet{min-width:0;background:var(--surface);border-top:1px solid var(--line);padding-block:14px 18px;padding-inline:16px;overflow-y:auto;max-height:48vh}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:21px;margin:0 0 2px;letter-spacing:.01em;text-wrap:balance}
.sheet h3{font-family:var(--f-display);font-weight:600;font-size:16px;margin:16px 0 6px;letter-spacing:.02em}
.sheet p{margin:6px 0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-family:var(--f-mono)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hud .lvl{font-family:var(--f-display);font-weight:600;font-size:15px;margin-right:auto}
.hud .pts{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--accent)}
.combo{font-family:var(--f-mono);font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.combo:empty{display:none}
.tbar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:8px 0 10px}
.tbar span{display:block;height:100%;background:var(--accent);transition:width .2s linear}
.tbar.low span{background:var(--bad)}
.q{font-size:16.5px;font-weight:500}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.choices button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:11px 10px;text-align:left}
.choices button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,transparent)}
.choices button.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 130px}
.field label{font-size:12.5px;color:var(--muted)}
.field input,.field select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-family:var(--f-mono);font-size:16px;min-width:0;width:100%}
.field input.ok{border-color:var(--good)} .field input.no{border-color:var(--bad)}
.fb{margin-top:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:14.5px}
.fb.good{border-color:var(--good);color:var(--good)}
.fb.bad{border-color:var(--bad)} .fb.bad strong{color:var(--bad)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tools .btn{font-size:13.5px;padding:6px 10px}
.tools .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
details{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:13.5px}
details ol,details ul{margin:6px 0;padding-left:20px;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.03em}
tr.me td{background:var(--accent-soft)}
.wrapx{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12.5px;border:1px solid var(--line)}
.pill.pass{border-color:var(--good);color:var(--good)}
.pill.fail{border-color:var(--bad);color:var(--bad)}
.stars{color:var(--star);letter-spacing:2px;font-size:15px}
.stars i{font-style:normal;color:var(--star-off)}
.levels{display:grid;gap:8px;margin-top:10px}
.lv{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;text-align:left;width:100%}
.lv .no{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--accent);text-align:center}
.lv .nm{font-family:var(--f-display);font-weight:600;font-size:16px;display:block}
.lv .sb{font-size:13px;color:var(--muted);display:block}
.lv:disabled{opacity:.5}
.lv:disabled .no{color:var(--muted)}
.rankcard{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,var(--surface-2),var(--surface))}
.rankcard .big{font-family:var(--f-display);font-weight:700;font-size:22px}
.meter{height:6px;background:var(--bg);border-radius:999px;overflow:hidden;margin-top:6px}
.meter span{display:block;height:100%;background:var(--accent)}
.result{text-align:center;padding:6px 0}
.result .bigstars{font-size:44px;letter-spacing:6px;color:var(--star);line-height:1.1}
.result .bigstars i{font-style:normal;color:var(--star-off)}
.result .score{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1.1}
.promo{margin:10px auto 0;max-width:340px;padding:10px;border:1px solid var(--accent);border-radius:10px;color:var(--accent);font-family:var(--f-display);font-weight:600}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
.bigstars b{display:inline-block;font-weight:400;animation:pop .45s both}
.bigstars b:nth-child(2){animation-delay:.18s}.bigstars b:nth-child(3){animation-delay:.36s}
.flaglist{display:grid;grid-template-columns:auto 1fr auto auto;gap:3px 10px;font-size:14px;margin-top:6px;align-items:center}
.log{font-size:13.5px;margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.log li{padding:5px 8px;background:var(--surface-2);border-radius:6px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;margin-top:6px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.legend canvas{width:40px;height:22px;background:#f5f0e1;border-radius:3px;border:1px solid var(--line);flex:none}
@media (min-width:900px){
  body{grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto auto minmax(0,1fr)}
  .top,.tabs{grid-column:1 / -1}
  .stage{grid-column:1;grid-row:3}
  .sheet{grid-column:2;grid-row:3;max-height:none;border-top:0;border-left:1px solid var(--line)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.mappal{position:absolute;left:10px;top:10px;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:calc(100% - 74px);padding:6px 8px;border-radius:10px;background:rgba(251,252,247,.95);color:#1b2117;box-shadow:0 1px 4px rgba(0,0,0,.25);font-size:12.5px}
.mappal[hidden]{display:none}.mappal .pl{color:#4a5544;font-size:12px}.mappal .sep{width:1px;height:22px;background:rgba(0,0,0,.15)}
.mappal .sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.3);padding:0}
.mappal .sw.on{box-shadow:0 0 0 3px #1b2117}
.mappal .ub{width:40px;height:40px;padding:2px;border-radius:8px;border:1px solid rgba(0,0,0,.18);background:#fff;display:grid;place-items:center}
.mappal .ub.on{border:2px solid #1b2117;background:#eef2e6}.mappal .ub canvas{pointer-events:none}
.mappal .pb{border:1px solid rgba(0,0,0,.2);background:#fff;color:#1b2117;border-radius:7px;padding:4px 8px;font-size:12.5px}
@media (max-width:600px){.mappal{gap:4px;padding:4px 6px;max-width:calc(100% - 64px)}.mappal .ub{width:32px;height:32px}.mappal .ub canvas{width:28px!important;height:28px!important}.mappal .sw{width:22px;height:22px}.mappal .phint{display:none}}
.stagebar .plock[aria-pressed="true"]{background:#2f3d27;color:#fff;border-color:#2f3d27}
@media (max-width:899px){#comp{grid-template-rows:48% 52%}}
</style>

<header class="top">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="#f0b03a" stroke-width="1.6"/><path d="M13 3.5 16 13h-6z" fill="#ff6f5e"/><path d="M13 22.5 10 13h6z" fill="#e9eddf"/></svg>
    <span>ปฏิบัติการ<em>เข็มทิศ</em></span>
  </div>
  <div class="rankchip" id="rankchip"></div>
  <div class="mission">
    <label for="code">รหัสภารกิจ</label>
    <input id="code" value="ALPHA-01" maxlength="16" autocomplete="off" spellcheck="false">
    <button class="btn" id="gen">สร้างพื้นที่</button>
    <button class="btn iconbtn" id="snd" aria-pressed="true" aria-label="เสียง" title="เปิด/ปิดเสียง">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 7h3l4-3v10l-4-3H2z" fill="currentColor"/><path id="sndwave" d="M12 6.5c1.2 1.4 1.2 3.6 0 5M14 4.5c2.3 2.6 2.3 6.4 0 9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main class="stage" id="stage">
  <canvas id="map" aria-label="แผนที่ภูมิประเทศจำลอง"></canvas>
  <div id="comp" hidden><canvas id="pano" aria-label="ภาพรอบตัว"></canvas><canvas id="dial" aria-label="เข็มทิศเลนเซติก"></canvas></div>
  <div class="viewseg" id="viewseg" hidden><button id="vMap" aria-pressed="true">แผนที่</button><button id="vComp" aria-pressed="false">เข็มทิศ</button></div>
  <div class="stagebar" id="zoombar">
    <button class="btn iconbtn" id="zin" aria-label="ขยาย">+</button>
    <button class="btn iconbtn" id="zout" aria-label="ย่อ">−</button>
    <button class="btn iconbtn" id="zfit" aria-label="ดูทั้งระวาง"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
  </div>
  <div class="turnbar" id="turnbar" hidden>
    <span style="display:flex;gap:8px"><button class="btn" id="tl2" aria-label="หมุนซ้าย 10 องศา">◀◀</button><button class="btn" id="tl1" aria-label="หมุนซ้ายเล็กน้อย">◀</button></span>
    <span style="display:flex;gap:8px"><button class="btn" id="tr1" aria-label="หมุนขวาเล็กน้อย">▶</button><button class="btn" id="tr2" aria-label="หมุนขวา 10 องศา">▶▶</button></span>
  </div>
  <div class="compbar" id="compbar" hidden>
    <div class="seg"><button id="cmSight" aria-pressed="false">ยกขึ้นเล็ง</button><button id="cmTop" aria-pressed="true">มองหน้าปัด</button></div>
    <div class="bz" id="bzbar"><button class="btn" id="bzL" aria-label="หมุนวงแหวนทวนเข็ม 1 คลิก">↺ คลิก</button><button class="btn" id="bzR" aria-label="หมุนวงแหวนตามเข็ม 1 คลิก">คลิก ↻</button></div>
  </div>
  <div class="hint" id="turnhint" hidden>ลากซ้าย-ขวาเพื่อหมุนตัว</div>
  <div class="flash" id="flash"></div>
</main>
<section class="sheet" id="sheet" aria-live="polite"></section>
