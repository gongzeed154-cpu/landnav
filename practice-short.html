<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f3d27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>ฝึกแผนที่เข็มทิศ ฉบับย่อ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: field tool — the map/compass stage fills the screen, the task sheet docks below on phones and to the right on wide screens */
:root{
  --bg:#e8ebe0; --surface:#fbfcf7; --surface-2:#f0f3e8; --ink:#1b2117; --muted:#5a6450; --line:#cbd2bf;
  --accent:#4b6a2e; --accent-ink:#ffffff; --accent-soft:#dfe8d1;
  --good:#2b7a30; --bad:#b3261e; --warn:#9c5410;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12160f; --surface:#1a2016; --surface-2:#222a1d; --ink:#e4e9dc; --muted:#9ba68f; --line:#343f2c;
  --accent:#a3c472; --accent-ink:#12160f; --accent-soft:#2b3622;
  --good:#7cc47f; --bad:#f08075; --warn:#e3a464; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12160f; --surface:#1a2016; --surface-2:#222a1d; --ink:#e4e9dc; --muted:#9ba68f; --line:#343f2c;
  --accent:#a3c472; --accent-ink:#12160f; --accent-soft:#2b3622;
  --good:#7cc47f; --bad:#f08075; --warn:#e3a464; color-scheme:dark}
body.night{
  --bg:#000; --surface:#0b0000; --surface-2:#140202; --ink:#ff5a4a; --muted:#b33a2e; --line:#3a0d08;
  --accent:#ff3b2b; --accent-ink:#000; --accent-soft:#2a0603; --good:#ff7a6a; --bad:#ff2a1a; --warn:#ff6a3a; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;min-width:0}
.brand svg{flex:none}
.mission{display:flex;align-items:center;gap:6px;margin-left:auto}
.mission label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.mission input{width:8.5em;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-family:var(--f-mono);font-size:14px;text-transform:uppercase}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 12px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;padding:0}

.tabs{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab b{font-family:var(--f-mono);font-weight:600;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] b{color:var(--accent-ink)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}

.stage{position:relative;min-height:0;overflow:hidden;background:#d9d3c0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#comp{position:absolute;inset:0;display:grid;grid-template-rows:36% 64%;touch-action:none;background:#11140f}
#comp canvas{width:100%;height:100%;display:block;touch-action:none}
.stagebar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.stagebar .btn{background:rgba(251,252,247,.92);color:#1b2117;border-color:rgba(0,0,0,.18);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.viewseg{position:absolute;left:10px;top:10px;z-index:2;display:flex;border-radius:8px;overflow:hidden;border:1px solid rgba(0,0,0,.2);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.viewseg button{border:0;padding:6px 12px;background:rgba(251,252,247,.92);color:#1b2117;font-size:14px}
.viewseg button[aria-pressed="true"]{background:#4b6a2e;color:#fff}
.turnbar{position:absolute;left:0;right:0;bottom:12px;padding-inline:12px;display:flex;justify-content:space-between;gap:10px;z-index:2;pointer-events:none}
.turnbar span{pointer-events:auto}
.turnbar .btn{pointer-events:auto;background:rgba(20,24,18,.8);color:#e8eadf;border-color:rgba(255,255,255,.2)}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:52px;font-size:12px;color:#c9cfbf;background:rgba(0,0,0,.45);padding:3px 10px;border-radius:999px;z-index:2;white-space:nowrap}

.sheet{min-width:0;background:var(--surface);border-top:1px solid var(--line);padding-block:14px 18px;padding-inline:16px;overflow-y:auto;max-height:46dvh;max-height:46vh}
.sheet h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0 0 2px;text-wrap:balance}
.sheet h3{font-family:var(--f-display);font-weight:600;font-size:16px;margin:14px 0 6px}
.sheet p{margin:6px 0}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-family:var(--f-mono)}
.prog{height:5px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:8px 0 10px}
.prog span{display:block;height:100%;background:var(--accent)}
.q{font-size:16px;font-weight:500}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.choices button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px;text-align:left}
.choices button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.choices button.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 130px}
.field label{font-size:12.5px;color:var(--muted)}
.field input,.field select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-family:var(--f-mono);font-size:16px;min-width:0;width:100%}
.field input.ok{border-color:var(--good)} .field input.no{border-color:var(--bad)}
.fb{margin-top:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:14.5px}
.fb.good{border-color:var(--good);color:var(--good)}
.fb.bad{border-color:var(--bad)}
.fb.bad strong{color:var(--bad)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tools .btn{font-size:13.5px;padding:6px 10px}
.tools .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
details{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:13.5px}
details ol,details ul{margin:6px 0;padding-left:20px;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.03em}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12.5px;border:1px solid var(--line)}
.pill.pass{border-color:var(--good);color:var(--good)}
.pill.fail{border-color:var(--bad);color:var(--bad)}
.log{font-size:13.5px;margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.log li{padding:5px 8px;background:var(--surface-2);border-radius:6px}
.cplist{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;font-size:14px;margin-top:6px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;margin-top:6px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.legend canvas{width:40px;height:22px;background:#f5f0e1;border-radius:3px;border:1px solid var(--line);flex:none}
.score{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.1}
.muted{color:var(--muted)}
.wrapx{overflow-x:auto}

.compbar{position:absolute;right:10px;top:10px;z-index:2;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.compbar .seg{display:flex;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.compbar .seg button{border:0;padding:6px 10px;background:rgba(20,24,18,.85);color:#e8eadf;font-size:13.5px}
.compbar .seg button[aria-pressed="true"]{background:#4b6a2e;color:#fff}
.compbar .bz{display:flex;gap:6px}
.compbar .bz .btn{background:rgba(20,24,18,.85);color:#e8eadf;border-color:rgba(255,255,255,.25);font-size:13.5px;padding:6px 10px}
.hint{top:auto!important;bottom:18px;white-space:normal!important;max-width:40%;text-align:center}
body.night .stage,body.night #comp{filter:grayscale(1) sepia(1) saturate(6) hue-rotate(-50deg) brightness(.55)}

@media (min-width:900px){
  body{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto auto minmax(0,1fr)}
  .top,.tabs{grid-column:1 / -1}
  .stage{grid-column:1;grid-row:3}
  .sheet{grid-column:2;grid-row:3;max-height:none;border-top:0;border-left:1px solid var(--line)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.mappal{position:absolute;left:10px;top:10px;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:calc(100% - 74px);padding:6px 8px;border-radius:10px;background:rgba(251,252,247,.95);color:#1b2117;box-shadow:0 1px 4px rgba(0,0,0,.25);font-size:12.5px}
.mappal[hidden]{display:none}.mappal .pl{color:#4a5544;font-size:12px}.mappal .sep{width:1px;height:22px;background:rgba(0,0,0,.15)}
.mappal .sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.3);padding:0}
.mappal .sw.on{box-shadow:0 0 0 3px #1b2117}
.mappal .ub{width:40px;height:40px;padding:2px;border-radius:8px;border:1px solid rgba(0,0,0,.18);background:#fff;display:grid;place-items:center}
.mappal .ub.on{border:2px solid #1b2117;background:#eef2e6}.mappal .ub canvas{pointer-events:none}
.mappal .pb{border:1px solid rgba(0,0,0,.2);background:#fff;color:#1b2117;border-radius:7px;padding:4px 8px;font-size:12.5px}
@media (max-width:600px){.mappal{gap:4px;padding:4px 6px;max-width:calc(100% - 64px)}.mappal .ub{width:32px;height:32px}.mappal .ub canvas{width:28px!important;height:28px!important}.mappal .sw{width:22px;height:22px}.mappal .phint{display:none}}
[hidden]{display:none!important}body{margin:0}.homebtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);text-decoration:none;color:inherit;margin-right:6px;flex:none}</style>
<script src="config.js"></script>
</head>
<body>


<header class="top">
  <div class="brand"><a class="homebtn" href="./" aria-label="หน้าแรก" title="หน้าแรก">⌂</a>
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 3.5 16 13h-6z" fill="#c0392b"/><path d="M13 22.5 10 13h6z" fill="currentColor"/></svg>
    <span>ฝึกแผนที่และเข็มทิศ <small style="font-size:.7em;opacity:.7">ฉบับย่อ 30 นาที</small></span>
  </div>
  <div class="mission">
    <label for="code">รหัสภารกิจ</label>
    <input id="code" value="ALPHA-01" maxlength="16" autocomplete="off" spellcheck="false">
    <button class="btn" id="gen">สร้างพื้นที่</button>
    <button class="btn iconbtn" id="night" aria-pressed="false" title="โหมดกลางคืน (แสงแดง)" aria-label="โหมดกลางคืน">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M12.5 2.5a6.5 6.5 0 1 0 3 9.8A5.5 5.5 0 0 1 12.5 2.5z" fill="currentColor"/></svg>
    </button>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main class="stage" id="stage">
  <canvas id="map" aria-label="แผนที่ภูมิประเทศจำลอง"></canvas>
  <div id="comp" hidden><canvas id="pano" aria-label="ภาพรอบตัว"></canvas><canvas id="dial" aria-label="เข็มทิศเลนเซติก"></canvas></div>
  <div class="viewseg" id="viewseg" hidden>
    <button id="vMap" aria-pressed="true">แผนที่</button><button id="vComp" aria-pressed="false">เข็มทิศ</button>
  </div>
  <div class="stagebar" id="zoombar">
    <button class="btn iconbtn" id="zin" aria-label="ขยาย">+</button>
    <button class="btn iconbtn" id="zout" aria-label="ย่อ">−</button>
    <button class="btn iconbtn" id="zfit" aria-label="ดูทั้งระวาง"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
  </div>
  <div class="turnbar" id="turnbar" hidden>
    <span style="display:flex;gap:8px"><button class="btn" id="tl2" aria-label="หมุนซ้าย 10 องศา">◀◀</button><button class="btn" id="tl1" aria-label="หมุนซ้ายเล็กน้อย">◀</button></span><span style="display:flex;gap:8px"><button class="btn" id="tr1" aria-label="หมุนขวาเล็กน้อย">▶</button><button class="btn" id="tr2" aria-label="หมุนขวา 10 องศา">▶▶</button></span>
  </div>
  <div class="compbar" id="compbar" hidden>
    <div class="seg"><button id="cmSight" aria-pressed="false">ยกขึ้นเล็ง</button><button id="cmTop" aria-pressed="true">มองหน้าปัด</button></div>
    <div class="bz" id="bzbar"><button class="btn" id="bzL" aria-label="หมุนวงแหวนทวนเข็ม 1 คลิก">↺ คลิก</button><button class="btn" id="bzR" aria-label="หมุนวงแหวนตามเข็ม 1 คลิก">คลิก ↻</button></div>
  </div>
  <div class="hint" id="turnhint" hidden>ลากซ้าย-ขวาเพื่อหมุนตัว</div>
</main>
<section class="sheet" id="sheet" aria-live="polite"></section>


<script>
(function(){
'use strict';
const CFG={short:true,web:true,form:{url:'',e:{}}};
/* ================= SHARED CORE: world, map, tools, lensatic compass ================= */
/* ---------- constants & helpers ---------- */
const MAP=8000, E0=40000, N0=20000, ZONE='47P PS', MPD=6400/360, FOV=50;
const LAT0=14+15/60, LON0=99+30/60, M_LAT=110600, M_LON=107870; // SW corner of the sheet, metres per degree
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hyp=Math.hypot;
const wrap360=a=>((a%360)+360)%360;
const wrapMil=a=>((a%6400)+6400)%6400;
const angDiff=(a,b,m)=>{m=m||360;return ((a-b)%m+m*1.5)%m-m/2;};
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hashStr(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gaussR(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const gauss=()=>gaussR(Math.random);
function makeNoise(r){
  const q=[...Array(256).keys()];for(let i=255;i>0;i--){const j=(r()*(i+1))|0;[q[i],q[j]]=[q[j],q[i]];}
  const p=new Uint8Array(512);for(let i=0;i<512;i++)p[i]=q[i&255];
  const h=(x,y)=>p[(p[x&255]+(y&255))&255]/255;
  const n=(x,y)=>{const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
    const a=h(ix,iy),b=h(ix+1,iy),c=h(ix,iy+1),d=h(ix+1,iy+1);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;};
  return (x,y)=>n(x,y)*0.55+n(x*2.03+17,y*2.03+5)*0.3+n(x*4.1+3,y*4.1+11)*0.15-0.5;
}
const gridAz=(a,b)=>wrap360(Math.atan2(b.x-a.x,b.y-a.y)*180/Math.PI);
const dist=(a,b)=>hyp(a.x-b.x,a.y-b.y);
const mils=d=>Math.round(wrapMil(d*MPD));
const fd=v=>{let r=Math.round(wrap360(v)*2)/2;if(r>=360)r-=360;return r%1?r.toFixed(1):String(r);};
function gridRef(x,y,digits){const f=digits===8?10:100,w=digits===8?4:3;
  const e=Math.floor((E0+x)/f),n=Math.floor((N0+y)/f);return String(e).padStart(w,'0')+' '+String(n).padStart(w,'0');}
const DIRS=['เหนือ','ตะวันออกเฉียงเหนือ','ตะวันออก','ตะวันออกเฉียงใต้','ใต้','ตะวันตกเฉียงใต้','ตะวันตก','ตะวันตกเฉียงเหนือ'];
const dir8=az=>DIRS[Math.round(wrap360(az)/45)%8];
/* geographic coordinates */
const latSecAt=y=>(LAT0+y/M_LAT)*3600, lonSecAt=x=>(LON0+x/M_LON)*3600;
const yAtLatSec=s=>(s/3600-LAT0)*M_LAT, xAtLonSec=s=>(s/3600-LON0)*M_LON;
function dms(sec){sec=Math.floor(sec+1e-6);const d=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return{d,m,s};}
const fmtDMS=(sec,hemi)=>{const o=dms(sec);return`${o.d}°${String(o.m).padStart(2,'0')}′${String(o.s).padStart(2,'0')}″${hemi||''}`;};
function parseDMS(str){const n=(str.match(/\d+(\.\d+)?/g)||[]).map(Number);if(n.length<3)return NaN;return n[0]*3600+n[1]*60+n[2];}

/* ---------- world generation ---------- */
let W=null;
function genWorld(code){
  const r=mulberry32(hashStr(code));
  const noise=makeNoise(r), noise2=makeNoise(r);
  const hills=[];const nh=11+((r()*5)|0);

let VT={ox:0,oy:0,z:1};

function drawMap(){

  c.strokeStyle='#3584c6';c.lineWidth=Math.max(5,1.1/z);for(const p of W.streamPaths)c.stroke(p);
  c.lineWidth=Math.max(16,2.2/z);c.stroke(W.river);
  c.strokeStyle='#2b2118';c.lineWidth=Math.max(16,4.4/z);for(const p of W.roadPaths)c.stroke(p);
  c.strokeStyle='#f0a24a';c.lineWidth=Math.max(10,2.6/z);for(const p of W.roadPaths)c.stroke(p);
  c.strokeStyle='#b4502a';c.lineWidth=Math.max(8,1.7/z);c.stroke(W.road3Path);

  // cliff (hachured line, ticks point downhill)
  if(W.cliff){const cl=W.cliff;c.strokeStyle='#5b3214';c.lineWidth=1.4;c.beginPath();let first=true;
    for(let u=-cl.L*0.85;u<=cl.L*0.85;u+=20){const x=cl.x-cl.ny*u,y=cl.y+cl.nx*u,[p,q]=S2(x,y);first?c.moveTo(p,q):c.lineTo(p,q);first=false;}c.stroke();
    c.beginPath();for(let u=-cl.L*0.8;u<=cl.L*0.8;u+=Math.max(25,9/z)){const x=cl.x-cl.ny*u,y=cl.y+cl.nx*u,[p,q]=S2(x,y),[p2,q2]=S2(x-cl.nx*Math.max(30,7/z),y-cl.ny*Math.max(30,7/z));c.moveTo(p,q);c.lineTo(p2,q2);}c.lineWidth=1;c.stroke();}
  if(z>0.06){const s=W.swamp;for(let i=-2;i<=2;i++)for(let j=-1;j<=1;j++){const x=s.x+i*s.a*0.33,y=s.y+j*s.b*0.5;if(W.inSwamp(x,y)){const[p,q]=S2(x,y);SYM.marsh(c,p,q,9);}}}
  for(const b of W.bridges){const[p,q]=S2(b.x,b.y);const L=Math.max(9,50*z),Wd=Math.max(5,16*z);c.save();c.translate(p,q);c.rotate(-b.ang);c.strokeStyle='#1a1a1a';c.lineWidth=1.4;
    c.beginPath();c.moveTo(-L/2-3,-Wd-3);c.lineTo(-L/2,-Wd);c.lineTo(L/2,-Wd);c.lineTo(L/2+3,-Wd-3);c.moveTo(-L/2-3,Wd+3);c.lineTo(-L/2,Wd);c.lineTo(L/2,Wd);c.lineTo(L/2+3,Wd+3);c.stroke();c.restore();}
  const bs=clamp(16*z,2.2,9);for(const b of W.buildings){const[p,q]=S2(b.x,b.y);SYM.building(c,p,q,bs);}

    c.save();c.translate(p,q);c.rotate(a);c.font='500 10px "IBM Plex Mono",monospace';c.textAlign='center';const tw=c.measureText(String(l.L)).width;c.fillStyle='#f6f1e2';c.fillRect(-tw/2-2,-6,tw+4,12);c.fillStyle='#a05a22';c.fillText(String(l.L),0,0.5);c.restore();}}

  for(let k=0;k<=8;k++){const[gx]=S2(k*1000,0),[,gy]=S2(0,k*1000);

  {const la0=Math.ceil(latSecAt(0)/60),la1=Math.floor(latSecAt(MAP)/60),lo0=Math.ceil(lonSecAt(0)/60),lo1=Math.floor(lonSecAt(MAP)/60);c.strokeStyle='#2a1e3a';c.lineWidth=1.1;

    for(let o=lo0;o<=lo1;o++){const[p]=S2(xAtLonSec(o*60),0);c.moveTo(p,bot);c.lineTo(p,bot-cr*1.6);c.moveTo(p,top);c.lineTo(p,top+cr*1.6);}
    c.stroke();
    if(z>0.035){const f='italic 600 11px "IBM Plex Mono",monospace',rx=Math.min(right,w)-4,by=Math.min(bot,h)-8;
      for(let a=la0;a<=la1;a++){const[,q]=S2(0,yAtLatSec(a*60));if(q>30&&q<h-20){const o=dms(a*60);halo(`${o.d}°${o.m}′`,rx,q-8,f,'#2a1e3a','right');}}
      for(let o=lo0;o<=lo1;o++){const[p]=S2(xAtLonSec(o*60),0);if(p>40&&p<w-60){const d=dms(o*60);halo(`${d.d}°${d.m}′`,p,by,f,'#2a1e3a','center');}}}}
  for(let k=0;k<=8;k++){const[gx]=S2(k*1000,0),[,gy]=S2(0,k*1000);const e=String(E0/1000+k),n=String(N0/1000+k);
    if(gx>14&&gx<w-14)halo(e,gx,12,'600 12px "IBM Plex Mono",monospace','#14243a','center');

}

/* ---------- overlays ---------- */
function drawMarker(c,m){const[p,q]=S2(m.x,m.y);c.save();
  if(m.kind==='ring'){c.strokeStyle='#d6261c';c.lineWidth=2.5;c.beginPath();c.arc(p,q,16,0,7);c.stroke();c.beginPath();c.arc(p,q,2.2,0,7);c.fillStyle='#d6261c';c.fill();}
  else if(m.kind==='dot'){c.fillStyle='#d6261c';c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(p,q,4.5,0,7);c.fill();c.stroke();}
  else if(m.kind==='pin'){c.fillStyle=m.color||'#7a2fb5';c.strokeStyle='#fff';c.lineWidth=1.5;c.beginPath();c.arc(p,q,5,0,7);c.fill();c.stroke();}
  else if(m.kind==='sq'){const s=(m.size||100)*VT.z;c.strokeStyle=m.color||'#1f8a3a';c.lineWidth=2;c.strokeRect(p,q-s,s,s);}
  else if(m.kind==='cp'){c.strokeStyle=m.color||'#7a2fb5';c.lineWidth=2.2;c.beginPath();c.moveTo(p,q-14);c.lineTo(p+12,q+8);c.lineTo(p-12,q+8);c.closePath();c.stroke();c.fillStyle=c.strokeStyle;c.beginPath();c.arc(p,q,2,0,7);c.fill();}
  else if(m.kind==='sp'){c.strokeStyle='#7a2fb5';c.lineWidth=2.2;c.beginPath();c.arc(p,q,9,0,7);c.stroke();c.fillStyle='#7a2fb5';c.beginPath();c.arc(p,q,2,0,7);c.fill();}
  else if(m.kind==='x'){c.strokeStyle=m.color||'#d6261c';c.lineWidth=2.5;c.beginPath();c.moveTo(p-6,q-6);c.lineTo(p+6,q+6);c.moveTo(p+6,q-6);c.lineTo(p-6,q+6);c.stroke();}
  if(m.label){c.font='600 12px "IBM Plex Sans Thai",sans-serif';c.textAlign='left';c.textBaseline='middle';c.lineWidth=3;c.strokeStyle='rgba(255,255,255,.95)';c.strokeText(m.label,p+12,q-12);c.fillStyle=m.color||'#d6261c';c.fillText(m.label,p+12,q-12);}
  c.restore();}
function drawPencil(c,L,tmp){const[a1,b1]=S2(L.a.x,L.a.y),[a2,b2]=S2(L.b.x,L.b.y);const col=L.color||'#2a2a2a';c.save();c.lineCap='round';
  if(col===LCOL.y){c.strokeStyle='rgba(40,30,0,.75)';c.lineWidth=4.2;c.beginPath();c.moveTo(a1,b1);c.lineTo(a2,b2);c.stroke();}
  c.strokeStyle=col;c.globalAlpha=tmp?.75:1;c.lineWidth=col==='#2a2a2a'?1.7:2.4;if(tmp)c.setLineDash([6,4]);
  c.beginPath();c.moveTo(a1,b1);c.lineTo(a2,b2);c.stroke();c.setLineDash([]);c.fillStyle=col;for(const[p,q]of[[a1,b1],[a2,b2]]){c.beginPath();c.arc(p,q,2.2,0,7);c.fill();}c.restore();}
function drawOverlays(c,w,h){
  const o=O;
  if(o.tracks)for(const t of o.tracks){if(t.pts.length<2)continue;c.save();c.strokeStyle=t.color;c.lineWidth=t.width||2.2;c.setLineDash(t.dash||[]);c.lineJoin='round';c.beginPath();t.pts.forEach((p,i)=>{const[a,b]=S2(p.x,p.y);i?c.lineTo(a,b):c.moveTo(a,b);});c.stroke();c.restore();}
  if(o.rays)for(const r of o.rays){const a=r.az*Math.PI/180,[p,q]=S2(r.x,r.y),[p2,q2]=S2(r.x+Math.sin(a)*9000,r.y+Math.cos(a)*9000);c.save();c.strokeStyle='#7a2fb5';c.lineWidth=1.6;c.setLineDash([8,4]);c.beginPath();c.moveTo(p,q);c.lineTo(p2,q2);c.stroke();c.restore();}
  if(o.line){const[a1,b1]=S2(o.line.a.x,o.line.a.y),[a2,b2]=S2(o.line.b.x,o.line.b.y);c.save();c.strokeStyle=o.line.color||'#222';c.lineWidth=1.6;if(o.line.dash)c.setLineDash(o.line.dash);c.beginPath();c.moveTo(a1,b1);c.lineTo(a2,b2);c.stroke();c.restore();}
  if(o.lines)for(const L of o.lines)drawPencil(c,L,false);
  if(o.tmpLine)drawPencil(c,o.tmpLine,true);
  if(o.ruler)drawRuler(c,o.ruler.a,o.ruler.b);
  if(o.plate)drawPlate(c,o.plate);
  if(o.marks)for(const m of o.marks)drawMarker(c,m);
  for(const u of UNITS){const[p,q]=S2(u.x,u.y);drawUnit(c,p,q,u.sym,u.side,clamp(30*Math.sqrt(VT.z/0.08),20,40));}
}
function drawRuler(c,A,B){
  const az=Math.atan2(B.x-A.x,B.y-A.y),len=Math.max(dist(A,B)+700,2000),ux=Math.sin(az),uy=Math.cos(az);
  const nx=uy,ny=-ux;const off=16/VT.z;const z=VT.z;const step=z*50>=5?50:100;
  c.save();c.strokeStyle='rgba(20,20,20,.85)';
  const P=(d,o)=>S2(A.x+ux*d+nx*o,A.y+uy*d+ny*o);
  const p0=P(0,0),p1=P(len,0),p2=P(len,off*1.7),p3=P(0,off*1.7);
  c.fillStyle='rgba(75,96,58,.88)';c.beginPath();c.moveTo(...p0);c.lineTo(...p1);c.lineTo(...p2);c.lineTo(...p3);c.closePath();c.fill();c.lineWidth=1;c.stroke();
  c.strokeStyle='#e9eddf';c.fillStyle='#e9eddf';
  for(let d=0;d<=len;d+=step){const big=d%500===0,m=d%100===0;const L=(big?12:m?8:4)/z;const q1=P(d,0),q2=P(d,L);
    c.lineWidth=big?1.3:.8;c.beginPath();c.moveTo(...q1);c.lineTo(...q2);c.stroke();
    if(big&&d<=len-200){const t=P(d,off*1.2);c.font='600 9.5px "IBM Plex Mono",monospace';c.textAlign='center';c.textBaseline='middle';c.fillText(String(d),t[0],t[1]);}}
  const t=P(len-160,off*1.2);c.font='600 9px "IBM Plex Mono",monospace';c.textAlign='center';c.fillText('1:50000',t[0],t[1]);
  c.restore();}

/* ---------- square protractor plate (1:50,000) ---------- */
const PLATE={H:2500,romer:{x:-440,y:1500},sixty:{x:1870,y:-250,len:1843}};
const insidePlate=m=>!!O.plate&&Math.abs(m.x-O.plate.x)<=PLATE.H&&Math.abs(m.y-O.plate.y)<=PLATE.H;
function plateBtns(extra){return`<button class="btn" id="pl" aria-pressed="${!!O.plate}">แผ่นวัดมุม</button>${extra||''}`;}
function snapPlateView(p){const w=mapC.clientWidth,h=mapC.clientHeight,zz=clamp(Math.min(w-150,h-80)/1150,0.05,1.2);setView(p.x-(w/2-110)/zz,p.y-(h/2-56)/zz,zz);}
function bindPlate(opts){opts=opts||{};const b=document.getElementById('pl');if(b)b.addEventListener('click',()=>{
    if(O.plate)O.plate=null;else{const c=opts.center?opts.center():{x:V.cx,y:V.cy};O.plate={x:c.x,y:c.y};if(V.z<0.07||V.z>0.3)setView(c.x,c.y,clamp(Math.min(mapC.clientWidth,mapC.clientHeight)/5400,0.05,0.3));}
    b.setAttribute('aria-pressed',!!O.plate);requestDraw();});
  const s=document.getElementById('ps');if(s&&opts.romerAt)s.addEventListener('click',()=>{const p=opts.romerAt();O.plate={x:p.x-PLATE.romer.x,y:p.y-PLATE.romer.y};if(b)b.setAttribute('aria-pressed',true);snapPlateView(p);});
  const g=document.getElementById('pg');if(g&&opts.romerAt)g.addEventListener('click',()=>{const p=opts.romerAt();O.plate={x:p.x-PLATE.sixty.x,y:p.y-PLATE.sixty.y};if(b)b.setAttribute('aria-pressed',true);
    const w=mapC.clientWidth,h=mapC.clientHeight,zz=clamp(Math.min(w-150,h-90)/2100,0.05,1.2);setView(p.x-(w/2-120)/zz,p.y-(h/2-60)/zz,zz);});}
function drawPlate(c,P){
  const z=VT.z,H=PLATE.H,T=(dx,dy)=>S2(P.x+dx,P.y+dy),F=m=>m*z;
  const txt=(t,dx,dy,size,opt)=>{opt=opt||{};const fsz=Math.min(F(size),size>=200?30:size>=100?20:17);if(fsz<5.5)return;const[p,q]=T(dx,dy);c.save();c.translate(p,q);if(opt.rot)c.rotate(opt.rot);
    c.font=(opt.w||'600')+' '+fsz.toFixed(1)+'px '+(opt.f||'"IBM Plex Sans Thai",sans-serif');c.textAlign=opt.al||'center';c.textBaseline='middle';c.fillStyle='#0d0d0d';c.fillText(t,0,0);c.restore();};
  const line=(x1,y1,x2,y2,w)=>{const[a,b]=T(x1,y1),[d,e]=T(x2,y2);c.lineWidth=w||1;c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.stroke();};
  c.save();const[x0,y0]=T(-H,H),side=F(2*H);
  c.fillStyle='rgba(255,255,255,.40)';c.fillRect(x0,y0,side,side);c.strokeStyle='rgba(0,0,0,.85)';c.lineWidth=1.3;c.strokeRect(x0,y0,side,side);c.strokeStyle='#0d0d0d';

/* ---------- self-hosted web build: send scores to Google Apps Script ---------- */
const NET={last:0,status:''};
const netURL=()=>String((window.LNAV_CONFIG&&window.LNAV_CONFIG.SCRIPT_URL)||'').trim();
function outbox(){try{return JSON.parse(localStorage.getItem('lnav-outbox')||'[]')||[];}catch(e){return[];}}
function saveOutbox(a){try{localStorage.setItem('lnav-outbox',JSON.stringify(a.slice(-40)));}catch(e){}}
function netSend(p){const box=outbox().filter(x=>x.key!==p.key);box.push(p);saveOutbox(box);return netFlush();}
let netBusy=null;
function netFlush(){if(netBusy)return netBusy;const u=netURL();
  if(!u){NET.status='nourl';netNotify();return Promise.resolve('nourl');}
  if(navigator.onLine===false){NET.status='offline';netNotify();return Promise.resolve('offline');}
  netBusy=(async()=>{const left=[];for(const p of outbox()){try{await fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});NET.last=Date.now();}catch(e){left.push(p);}}
    saveOutbox(left);NET.status=left.length?'pending':'ok';netBusy=null;netNotify();return NET.status;})();return netBusy;}
function netNotify(){try{if(typeof window.onNetStatus==='function')window.onNetStatus();}catch(e){}}
function netText(){if(!netURL())return'ครูฝึกยังไม่ได้ตั้งค่าที่อยู่ส่งคะแนน (config.js) · แคปหน้าจอนี้ส่งครูฝึกแทน';
  const n=outbox().length;if(n)return`ยังส่งไม่สำเร็จ ${n} รายการ ${navigator.onLine===false?'(ออฟไลน์อยู่)':''} ระบบจะส่งให้เองเมื่อออนไลน์ หรือกด "ส่งคะแนนตอนนี้"`;
  return NET.last?`ส่งคะแนนถึงครูฝึกแล้ว ✓ ${new Date(NET.last).toLocaleTimeString('th-TH')}`:'คะแนนจะส่งถึงครูฝึกอัตโนมัติทุกครั้งที่จบโมดูล/ภารกิจ';}
if(CFG.web){window.addEventListener('online',()=>netFlush());setTimeout(()=>{if(outbox().length)netFlush();},2500);}

const C={x:0,y:0,h0:0,heading:0,disp:0,vel:0,far:null,near:null,lms:[],mode:'top',lum:0,night:false,hl:null};
function computePano(x,y){
  const h0=W.elev(x,y)+1.7,far=new Float32Array(720),near=new Float32Array(720);
  for(let k=0;k<720;k++){const a=k*0.5*Math.PI/180,sx=Math.sin(a),sy=Math.cos(a);let mf=-1,mn=-1;
    for(let d=30;d<6500;d+=d<1000?25:d<3000?50:100){const t=(W.elev(x+sx*d,y+sy*d)-h0)/d;if(t>mf)mf=t;if(d<700&&t>mn)mn=t;}
    far[k]=Math.atan(mf);near[k]=Math.atan(mn);}
  const lms=[];
  for(const L of W.landmarks){const d=hyp(L.x-x,L.y-y);if(d<120||d>7000)continue;const az=gridAz({x,y},L);const tgt=(L.top-h0)/d;const a=az*Math.PI/180,sx=Math.sin(a),sy=Math.cos(a);
    let vis=true;for(let s=40;s<d-60;s+=s<1000?25:50){if((W.elev(x+sx*s,y+sy*s)-h0)/s>tgt+0.002){vis=false;break;}}

  if(t==='stream'){const s=W.streams.length?pick(W.streams):null;if(!s)return null;const p=s[(s.length*rnd(0.3,0.7))|0];return{x:p[0],y:p[1]};}
  if(t==='swamp')return{x:W.swamp.x,y:W.swamp.y};
  if(t==='road'){for(let i=0;i<50;i++){const rd=pick(W.roads.slice(0,2)),p=pick(rd);if(p[0]>400&&p[1]>400&&p[0]<MAP-400&&p[1]<MAP-400&&W.villages.every(v=>hyp(v.x-p[0],v.y-p[1])>600)&&W.bridges.every(b=>hyp(b.x-p[0],b.y-p[1])>300))return{x:p[0],y:p[1]};}return null;}

/* ---------- self-location drill: terrain association + resection with 1, 2 or 3 landmarks ---------- */
function findStand(kind){
  for(let t=0;t<120;t++){let p,linear=null,ldir=0;
    if(kind===1){const useStream=W.streams.length&&Math.random()<0.4;
      if(useStream){const s=pick(W.streams),i=(s.length*rnd(0.2,0.8))|0;if(!s[i+1])continue;p={x:s[i][0],y:s[i][1]};ldir=Math.atan2(s[i+1][0]-s[i][0],s[i+1][1]-s[i][1])*180/Math.PI;linear='ริมลำห้วย';}
      else{const ri=(Math.random()*W.roads.length)|0,rd=W.roads[ri];if(!rd||rd.length<20)continue;const i=(rd.length*rnd(0.1,0.9))|0;if(!rd[i+1])continue;p={x:rd[i][0],y:rd[i][1]};ldir=Math.atan2(rd[i+1][0]-rd[i][0],rd[i+1][1]-rd[i][1])*180/Math.PI;linear=ri===2?'ถนนสายรอง':'ถนนสายหลัก';}
      if(p.x<500||p.y<500||p.x>MAP-500||p.y>MAP-500||W.isWater(p.x,p.y))continue;}
    else{p=randLand(700);}
    if(W.villages.some(v=>hyp(v.x-p.x,v.y-p.y)<350))continue;
    const vis=computePano(p.x,p.y).filter(l=>l.vis&&l.d>600&&l.d<5500);
    if(kind===1){const ok=vis.filter(l=>Math.abs(angDiff(l.az,ldir,180))>35);if(ok.length)return{p,kind,linear,vis};continue;}
    // need `kind` landmarks spread at least 30 degrees apart
    const sorted=vis.slice().sort((a,b)=>a.az-b.az);let chosen=[];
    for(const l of shuffle(sorted.slice())){if(chosen.every(o=>Math.abs(angDiff(o.az,l.az))>=30))chosen.push(l);if(chosen.length>=kind)break;}
    if(chosen.length>=kind)return{p,kind,linear,vis};}
  const p=randLand(700);return{p,kind,linear:null,vis:computePano(p.x,p.y).filter(l=>l.vis)};}

      <p class="muted" style="font-size:13px">เส้นประเขียว = แนวเล็งที่ถูกต้อง · เส้นประม่วง = เส้นที่คุณลาก</p>`;
    o.onDone({err,html});}

/* ================= TRAINING APP ================= */
const APP={code:'ALPHA-01',mod:'m1',view:'map',store:{},night:false};

function saveStore(){try{localStorage.setItem(SKEY,JSON.stringify(APP.store));}catch(e){}}
function rec(mod,score,total,pass){const s=APP.store[APP.code]||(APP.store[APP.code]={});const p=s[mod];if(!p||score/total>=p.score/p.total)s[mod]={score,total,pass:pass||(p&&p.pass)||false,at:Date.now()};else if(pass&&!p.pass)p.pass=true;saveStore();renderTabs();logAttempt(mod,score,total,score>=0&&pass);}
const MODS=[
  {id:'m1',n:'1',t:'แผนที่และภูมิประเทศ'},{id:'m2',n:'2',t:'อ่านพิกัด'},{id:'m3',n:'3',t:'เข็มทิศเลนเซติก'},{id:'m4',n:'4',t:'มุมภาค-ระยะ'},{id:'m5',n:'5',t:'เดินทางจำลอง'},{id:'m6',n:'6',t:'หาที่อยู่ตนเอง'},
  {id:'res',n:'',t:'ผลการฝึก'},{id:'leg',n:'',t:'ขอบระวาง'}];
function renderTabs(){const s=APP.store[APP.code]||{};$('#tabs').innerHTML=MODS.map(m=>`<button class="tab" role="tab" data-m="${m.id}" aria-selected="${APP.mod===m.id}">${m.n?`<b>${m.n}</b>`:''}${m.t}${s[m.id]&&s[m.id].pass?'<span class="dot" title="ผ่านแล้ว"></span>':''}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>setModule(b.dataset.m));}
const sheet=$('#sheet');
const setSheet=h=>{sheet.innerHTML=h;sheet.scrollTop=0;};
const on=(id,fn,ev)=>{const el=document.getElementById(id);if(el)el.addEventListener(ev||'click',fn);};
const val=id=>{const el=document.getElementById(id);return el?el.value:'';};
const num=id=>{const s=val(id).replace(/[^\d.\-]/g,'');return s===''?NaN:Number(s);};
function setStageView(v,showSeg){APP.view=v;$('#map').hidden=v!=='map';$('#comp').hidden=v!=='comp';$('#zoombar').hidden=v!=='map';$('#turnbar').hidden=v!=='comp';$('#turnhint').hidden=v!=='comp';$('#compbar').hidden=v!=='comp';

  const help=`<details><summary>ทบทวนการใช้เข็มทิศ</summary><ul><li>"มองหน้าปัด" = ถือแบบไม่ต้องยกขึ้นเล็ง อ่านค่าใต้เส้นขีดดำ · "ยกขึ้นเล็ง" = มองผ่านช่องเล็งหลังให้เส้นเล็งตรงที่หมาย แล้วมองผ่านแว่นขยายอ่านค่า</li><li>ตัวเลขสีแดงด้านในคือองศา ตัวเลขดำด้านนอกคือมิล (×100)</li><li>วงแหวนคลิก: 1 คลิก = 3° (120 คลิกรอบวง)</li><li>เข็มทิศเลนเซติกอ่านได้ถูกต้องใกล้เคียง 2°</li></ul></details>`;
  const show=()=>{
    if(st.i>=tasks.length){resetCompass({mode:'top'});setStageView('map',false);return finishCard('โมดูล 3 · เข็มทิศเลนเซติก',st.score,tasks.length,PASSAT(tasks.length,8),'m3');}
    const t=tasks[st.i];const head=`<div class="eyebrow">โมดูล 3 · งาน ${st.i+1}/${tasks.length}</div>${progress(st.i,tasks.length)}`;
    const done=(ok,msg)=>{if(ok)st.score++;$('#fbx').innerHTML=fb(ok,msg)+nextBtn('งานต่อไป');on('nx',()=>{st.i++;show();});};
    setStageView('comp',true);
    if(t.kind==='part'){const q=partQuestion();resetCompass({mode:'top',hl:q.key});
      setSheet(`${head}<p class="q">ส่วนที่มีวงแดงกะพริบคือส่วนใดของเข็มทิศเลนเซติก?</p>${choicesHTML(q.opts)}<div id="fbx"></div>`);
      choiceUI(q.opts,q.ans,ok=>done(ok,ok?'':'คำตอบคือ '+q.ans));}
    else if(t.kind==='caution'){const q=cautionQuestion();resetCompass({mode:'top'});
      setSheet(`${head}<p class="q">ขณะใช้เข็มทิศ ควรอยู่ห่างจาก<b>${q.item}</b> อย่างน้อยเท่าไร?</p>${choicesHTML(q.opts)}<div id="fbx"></div>`);
      choiceUI(q.opts,q.ans,ok=>done(ok,ok?'':'คำตอบคือ '+q.ans));}
    else if(t.kind==='face'){const X=Math.round(rnd(0,359));resetCompass({mode:'top'});
      setSheet(`${head}<p class="q">หันไปตามมุมภาคแม่เหล็ก <span class="mono">${X}°</span></p><p class="muted">หมุนตัวจนค่าใต้เส้นขีดดำเป็น ${X}° แล้วกดยืนยัน (ยอมคลาด ±2°) จะสลับไป "ยกขึ้นเล็ง" เพื่ออ่านผ่านแว่นขยายก็ได้</p>
        <div class="row"><button class="btn primary" id="ok">ยืนยันทิศ</button></div><div id="fbx"></div>${help}`);
      on('ok',()=>{const err=Math.round(angDiff(magHeading(),X)*10)/10;$('#ok').disabled=true;done(Math.abs(err)<=2,`คุณหันไปที่ <span class="mono">${fd(magHeading())}°</span> (คลาด ${err>0?'+':''}${err}°)`);});}
    else if(t.kind==='read'){resetCompass({mode:'sight'});
      setSheet(`${head}<p class="q">ยกขึ้นเล็งไปที่ <b>${esc(t.lm.name)}</b> แล้วอ่านมุมภาคแม่เหล็ก</p><p class="muted">ให้เส้นเล็งในช่องเล็งหลังทับที่หมาย แล้วอ่านค่าใต้เส้นดัชนีในแว่นขยาย (ยอมคลาด ±2°)</p>
        <div class="row"><div class="field"><label for="ans">มุมภาคแม่เหล็ก (องศา)</label><input id="ans" inputmode="decimal" autocomplete="off"></div><button class="btn primary" id="ok">ตรวจคำตอบ</button></div><div id="fbx"></div>${help}`);
      const check=()=>{const a=num('ans');if(isNaN(a))return;const truth=wrap360(t.lm.az-W.gmDeg),err=Math.round(angDiff(a,truth)*10)/10;$('#ans').disabled=true;$('#ok').disabled=true;
        done(Math.abs(err)<=2,`ค่าจริง <span class="mono">${fd(truth)}°</span> (คลาด ${err>0?'+':''}${err}°)`);};
      on('ok',check);on('ans',e=>{if(e.key==='Enter')check();},'keydown');}
    else if(t.kind==='nlight'){const X=Math.round(rnd(10,350));resetCompass({mode:'top',lum:Math.round(rnd(0,119))*3});let phase=1;
      const ui=()=>setSheet(`${head}<p class="q">ตั้งเข็มทิศใช้งานกลางคืน <b>แบบมีแสงสว่าง</b> มุม <span class="mono">${X}°</span></p>
        ${phase===1?`<ol style="font-size:14.5px;padding-left:20px;margin:6px 0"><li>หันตัวจนมุม ${X}° อยู่ใต้เส้นขีดดำ</li><li>หมุนวงแหวนคลิก (↺/↻) จนขีดพรายน้ำทับลูกศรพรายน้ำชี้ทิศเหนือ</li></ol><div class="row"><button class="btn primary" id="ok">ตั้งเสร็จ</button></div>`
        :`<p>ไฟดับแล้ว ให้หันตัวจน<b>ลูกศรพรายน้ำตรงกับขีดพรายน้ำ</b> แล้วกดยืนยัน</p><div class="row"><button class="btn primary" id="ok">ยืนยันทิศ</button></div>`}<div id="fbx"></div>`);
      ui();const bind=()=>on('ok',()=>{if(phase===1){const e1=Math.abs(angDiff(magHeading(),X)),e2=Math.abs(lumErr(X));
          if(e1>2.5||e2>2.5){$('#fbx').innerHTML=`<div class="fb bad">${e1>2.5?`ยังหันไม่ตรง ${X}° (ตอนนี้ ${fd(magHeading())}°)`:''} ${e2>2.5?'ขีดพรายน้ำยังไม่ทับลูกศร':''}</div>`;return;}
          phase=2;C.night=true;C.heading=wrap360(C.heading+(Math.random()<.5?-1:1)*rnd(60,150));requestDraw();ui();bind();}
        else{const err=Math.round(angDiff(magHeading(),X)*10)/10;C.night=false;requestDraw();$('#ok').disabled=true;done(Math.abs(err)<=3,`คุณหันไปที่ ${fd(magHeading())}° (คลาด ${err>0?'+':''}${err}°)`);}});bind();}
    else if(t.kind==='ndark'){const k=Math.round(rnd(4,40)),X=k*3;resetCompass({mode:'top',night:true,lum:0});
      setSheet(`${head}<p class="q">ตั้งเข็มทิศใช้งานกลางคืน <b>แบบไม่มีแสงสว่าง</b> มุม <span class="mono">${X}°</span></p>
        <ol style="font-size:14.5px;padding-left:20px;margin:6px 0"><li>เริ่มต้นขีดพรายน้ำตรงกับเส้นดัชนี (ตั้งไว้ให้แล้ว)</li><li>คำนวณจำนวนคลิก: มุม ÷ 3 แล้วหมุนวงแหวนทวนเข็ม (↺) ตามจำนวนคลิก</li><li>หันตัวจนลูกศรพรายน้ำตรงกับขีดพรายน้ำ</li></ol>
        <div class="row"><button class="btn primary" id="ok">ยืนยันทิศ</button></div><div id="fbx"></div>`);
      on('ok',()=>{const err=Math.round(angDiff(magHeading(),X)*10)/10,clicks=Math.round(wrap360(-C.lum)/3)%120;C.night=false;requestDraw();$('#ok').disabled=true;
        done(Math.abs(err)<=3,`ต้องหมุนทวนเข็ม ${k} คลิก (คุณหมุน ${clicks} คลิก) · หันไปที่ ${fd(magHeading())}° คลาด ${err>0?'+':''}${err}°`);});}
  };show();}};

/* ---------- module 4: azimuth & distance with pencil, plate and compass edge ---------- */
MOD.m4={start(){
  const qs=[];for(let i=0;i<(CFG.short?2:5);i++){let A,B;for(let k=0;k<100;k++){A=randLand(600);B=randLand(600);const d=dist(A,B);if(d>800&&d<3200)break;}qs.push({A,B});}
  const st={i:0,score:0};const show=()=>{
    if(st.i>=qs.length)return finishCard('โมดูล 4 · มุมภาคและระยะ',st.score,qs.length*3,PASSAT(qs.length*3,12),'m4');
    const{A,B}=qs[st.i];const gaz=gridAz(A,B),gm=Math.round(gaz),mm=wrap360(gm-W.gmDeg),bm=wrap360(mm+180),dd=Math.round(dist(A,B));
    O={plate:O.plate?{x:A.x,y:A.y}:null,lines:[],marks:[{x:A.x,y:A.y,kind:'dot',label:'A'},{x:B.x,y:B.y,kind:'dot',label:'B'}]};DRAW.on=false;
    const z=clamp(Math.min(mapC.clientWidth,mapC.clientHeight)*0.7/Math.max(dist(A,B),600),fitZoom(),0.6);setView((A.x+B.x)/2,(A.y+B.y)/2,z);
    setSheet(`<div class="eyebrow">โมดูล 4 · โจทย์ ${st.i+1}/${qs.length}</div>${progress(st.i,qs.length)}
      <p class="q">จาก A ไป B — หามุมภาคและระยะ</p><p class="muted">ขีดเส้นด้วยดินสอจาก A ไป B แล้ววัดด้วยแผ่นวัดมุมและขอบเข็มทิศ · ชุดนี้มุมกริด = มุมแม่เหล็ก ไม่ต้องแปลง</p>
      <div class="tools">${drawBtns()}<button class="btn" id="tp" aria-pressed="${!!O.plate}">แผ่นวัดมุมที่ A</button></div>
      <div class="row"><div class="field"><label for="a1">มุมภาค (องศา)</label><input id="a1" inputmode="decimal"></div><div class="field"><label for="a2">มุมภาคกลับ (องศา)</label><input id="a2" inputmode="decimal"></div><div class="field"><label for="a3">ระยะ (ม.)</label><input id="a3" inputmode="numeric"></div></div>
      <div class="row"><button class="btn primary" id="ok">ตรวจคำตอบ</button></div><div id="fbx"></div>
      <details><summary>ขั้นตอน</summary><ol><li>กด "ขีดเส้นดินสอ" แล้วลากจาก A ไป B (ลากเลยออกไปได้ เพื่อให้ตัดขอบแผ่น)</li><li>วางจุดกึ่งกลางแผ่นวัดมุมที่ A ให้เส้น N-S ขนานเส้นกริดตั้ง อ่านมุมตรงที่เส้นดินสอตัดขอบแผ่น</li><li>ชุดนี้ใช้มุมที่วัดได้ตั้งเข็มทิศได้ทันที (ไม่ต้องบวก/ลบ G-M)</li><li>มุมกลับ: มากกว่า 180° ลบ 180° · น้อยกว่า 180° บวก 180°</li><li>วางขอบเข็มทิศ (มาตรา 1:50000) ตามเส้น อ่านระยะที่ B</li></ol></details>`);
    bindDraw();
    on('tp',e=>{O.plate=O.plate?null:{x:A.x,y:A.y};e.currentTarget.setAttribute('aria-pressed',!!O.plate);if(O.plate)setView(A.x,A.y,Math.min(mapC.clientWidth,mapC.clientHeight)/5400);requestDraw();});
        on('ok',()=>{const a=[num('a1'),num('a2'),num('a3')];if(a.some(isNaN)){$('#fbx').innerHTML='<div class="fb bad">กรอกให้ครบทั้ง 3 ช่อง</div>';return;}
      const r=[Math.abs(angDiff(a[0],gaz))<=1,Math.abs(angDiff(a[1],wrap360(gaz+180)))<=1,Math.abs(a[2]-dd)<=dd*0.05];
      r.forEach((ok,k)=>{const el=$('#a'+(k+1));el.classList.add(ok?'ok':'no');el.disabled=true;});const n=r.filter(Boolean).length;st.score+=n;$('#ok').disabled=true;DRAW.on=false;
      $('#fbx').innerHTML=`<div class="fb ${n===3?'good':'bad'}"><strong>${n}/3</strong> · ค่าที่ถูก: มุมภาค <span class="mono">${fd(gm)}°</span> · กลับ <span class="mono">${fd(bm)}°</span> · ระยะ <span class="mono">${dd}</span> ม.</div>${nextBtn('โจทย์ต่อไป')}`;
      O.line={a:A,b:B,color:'#d6261c',dash:[6,4]};O.plate={x:A.x,y:A.y,az:gaz};requestDraw();on('nx',()=>{st.i++;show();});});
  };show();}};

/* ---------- module 5: navigation exercise with pace count ---------- */
function paceStd(){try{return Number(localStorage.getItem('lnav-pace'))||140;}catch(e){return 140;}}
MOD.m5={start(){
  let sp=null;for(let i=0;i<60&&!sp;i++){const p=randLand(900);if(W.roadDist(p.x,p.y)<60)sp=p;}sp=sp||randLand(900);
  const cps=[];let prev=sp;for(let k=0;k<(CFG.short?2:3);k++){let c=null;for(let i=0;i<300;i++){const a=rnd(0,2*Math.PI),d=rnd(800,1400),p={x:prev.x+Math.sin(a)*d,y:prev.y+Math.cos(a)*d};if(landOK(p.x,p.y)&&p.x>500&&p.y>500&&p.x<MAP-500&&p.y<MAP-500&&dist(p,sp)>600){c=p;break;}}c=c||randLand(600);cps.push(c);prev=c;}
  const trueStride=1+gauss()*0.03;
  const N={tp:{...sp},pp:{...sp},cps,found:0,trueTrack:[{...sp}],plan:[[{...sp}]],pins:[],rays:[],searches:[],time:0,paces:0,actual:0,log:[],pinMode:false,done:false};
  const draw=()=>{const marks=[{x:sp.x,y:sp.y,kind:'sp',label:'SP'}];
    N.cps.forEach((c,k)=>{if(k<N.found)marks.push({x:c.x,y:c.y,kind:'cp',label:'CP'+(k+1),color:'#1f8a3a'});});
    N.pins.forEach((p,k)=>marks.push({x:p.x,y:p.y,kind:'pin',label:'หมุด '+(k+1)}));
    O={plate:O.plate||null,lines:O.lines||[],ruler:O.ruler||null,marks,rays:N.rays,tracks:N.plan.map(seg=>({pts:seg,color:'#555',dash:[6,5],width:1.8}))};requestDraw();};
  const cpRows=()=>N.cps.map((c,k)=>`<span class="mono">CP${k+1}</span><span class="mono">${ZONE} ${gridRef(c.x,c.y,8)}</span><span>${k<N.found?'<span class="pill pass">พบแล้ว</span>':k===N.found?'<span class="pill">ถัดไป</span>':''}</span>`).join('');
  const lmOpts=()=>W.landmarks.map((l,k)=>`<option value="${k}">${esc(l.name)} (${gridRef(l.x,l.y,6)})</option>`).join('');
  const ui=msg=>{draw();setSheet(`<div class="eyebrow">โมดูล 5 · เดินทางจำลอง</div>
    <p>เริ่มที่ <b>SP</b> <span class="mono">${ZONE} ${gridRef(sp.x,sp.y,8)}</span> ไปหาจุดตรวจตามลำดับ ตำแหน่งจริงของคุณจะไม่แสดง เส้นประคือเส้นทางที่คุณคิดว่าเดิน</p>
    <div class="cplist">${cpRows()}</div>
    ${msg?`<div class="fb">${msg}</div>`:''}
    <h3>เดินหนึ่งขา (นับก้าว)</h3>
    <div class="row"><div class="field"><label for="laz">มุมภาค (องศา)</label><input id="laz" inputmode="decimal"></div><div class="field"><label for="ld">จำนวนก้าวที่นับ</label><input id="ld" inputmode="numeric"></div><button class="btn primary" id="walk">เดิน</button></div>
    <div class="row"><div class="field" style="flex:0 1 200px"><label for="pstd">ก้าวมาตรฐานของฉัน (ก้าว/100 ม.)</label><input id="pstd" inputmode="numeric" value="${paceStd()}"></div></div>
    <div class="tools"><button class="btn" id="obs">สังเกตรอบตัว</button><button class="btn" id="look">ส่องเข็มทิศ</button><button class="btn" id="find">ค้นหาจุดตรวจ</button><button class="btn" id="pin" aria-pressed="${N.pinMode}">ปักหมุด</button>${plateBtns()}${drawBtns()}</div>
    <h3>หาที่อยู่ของตนเอง (สกัดกลับ)</h3>
    <div class="row"><div class="field" style="flex-basis:100%"><label for="lm">จุดสังเกต</label><select id="lm">${lmOpts()}</select></div><div class="field"><label for="raz">มุมภาคกลับ จากจุดสังเกตมาหาเรา (องศา)</label><input id="raz" inputmode="decimal"></div><button class="btn" id="ray">ลากเส้น</button></div>
    <div class="tools"><button class="btn" id="rclr">ลบเส้นสกัดกลับ</button><button class="btn" id="usepin" ${N.pins.length?'':'disabled'}>ใช้หมุดล่าสุดเป็นตำแหน่งของฉัน</button><button class="btn" id="end">จบภารกิจ · ดูผล</button></div>
    <p class="muted mono">เวลาที่ใช้ ${Math.round(N.time)} นาที · นับก้าวรวม ${N.paces} ก้าว</p>
    <ul class="log">${N.log.slice(-6).reverse().map(l=>`<li>${l}</li>`).join('')}</ul>
    <details><summary>เทคนิคจากบทเรียน</summary><ul><li>ก้าวมาตรฐาน: เดินทางราบ 100 ม. 3-5 ครั้งแล้วหาค่าเฉลี่ย (เช่น 140 ก้าว/100 ม.) · ระยะ = จำนวนก้าว × 100 ÷ ก้าวมาตรฐาน</li><li>พื้นที่ลาดชันหรือขรุขระ ก้าวจะสั้นลง ต้องนับก้าวเพิ่ม</li><li>เดินตามมุม: ตั้งมุมใต้เส้นขีดดำ เล็งหาที่หมายในแนวเส้นเล็ง เดินไปที่หมายนั้น ทำซ้ำ</li><li>ชุดนี้เดินตัดผ่านแม่น้ำ หนองน้ำ และหน้าผาได้เป็นเส้นตรง ระยะที่นับคือระยะกระจัด (ระยะตรงบนแผนที่) จึงไม่ต้องเดินอ้อม · มุมภาคกริด = มุมภาคแม่เหล็ก</li><li>สกัดกลับแบบสองที่หมาย: เล็งไปยังที่หมาย 2 จุด หามุมกลับ (มากกว่า 180 ลบ 180 · น้อยกว่า 180 บวก 180) แปลงเป็นกริด ลากเส้น จุดตัดคือตำแหน่งของเรา</li><li>แบบหนึ่งที่หมาย: ถ้าอยู่บนถนนหรือลำน้ำ ใช้เส้นสกัดกลับเส้นเดียวตัดกับแนวถนน/ลำน้ำนั้น</li></ul></details>`);
    on('walk',walk);on('obs',()=>ui('<b>สิ่งที่สังเกตได้:</b> '+observeText(N.tp.x,N.tp.y).join(' · ')));
    on('pstd',e=>{const v=Number(e.target.value);if(v>=80&&v<=220){try{localStorage.setItem('lnav-pace',String(Math.round(v)));}catch(err){}}},'change');
    on('look',()=>{computePano(N.tp.x,N.tp.y);C.disp=magHeading();resetCompass({mode:'sight'});setStageView('comp',true);sheet.scrollTop=0;});
    on('find',find);on('pin',()=>{N.pinMode=!N.pinMode;DRAW.on=false;ui(N.pinMode?'แตะแผนที่เพื่อปักหมุด (แตะอีกครั้งเพื่อเพิ่มหมุด)':'');setStageView('map',true);});
    bindPlate();bindDraw();
    on('ray',()=>{const k=+val('lm'),a=num('raz');if(isNaN(a))return;const L=W.landmarks[k];N.rays.push({x:L.x,y:L.y,az:wrap360(a)});ui(`ลากเส้นจาก ${esc(L.name)} ที่มุมภาคกริด ${fd(a)}°`);});
    on('rclr',()=>{N.rays.length=0;ui('');});
    on('usepin',()=>{const p=N.pins[N.pins.length-1];N.pp={...p};N.plan.push([{...p}]);N.log.push(`ตั้งตำแหน่งใหม่ที่หมุด ${N.pins.length} (${gridRef(p.x,p.y,8)})`);ui('ตั้งตำแหน่งของคุณที่หมุดล่าสุดแล้ว');});
    on('end',aar);

function parseCodes(txt){const out=[],bad=[];const re=/(LN[12]|OC[12])\|[^\s\t"]*/g;let m;

    let t=parts[0],set='F';const rest=parts.slice(1);if(t==='LN2'||t==='OC2')set=rest.shift();
    if(t.startsWith('LN')){const[name,sid,mods,ts]=rest;const best={};for(const x of (mods||'').split(',').filter(Boolean)){const mm=/^(m\d):(\d+)\/(\d+)(p?)$/.exec(x);if(mm)best[mm[1]]={score:+mm[2],total:+mm[3],pass:!!mm[4]};}
      out.push({kind:'app',set,name,sid,best,at:parseInt(ts,36)*1000});}
    else{const[name,sid,stars,clr,so,ts]=t==='OC2'?rest:[rest[0],'',rest[1],rest[2],rest[3],rest[4]];out.push({kind:'game',set,name,sid,stars:+stars||0,cleared:+clr||0,so,at:parseInt(ts,36)*1000});}}
  return{out,bad};}
const better=(a,b)=>!a||b.score/b.total>a.score/a.total||(b.pass&&!a.pass);
async function importCodes(){const st=$('#impmsg'),txt=val('imptxt');const{out,bad}=parseCodes(txt);if(!out.length){st.textContent=bad.length?`รหัสผลถูกแก้ไข ${bad.length} รายการ จึงไม่นำเข้า`:'ไม่พบรหัสตรวจสอบในข้อความที่วาง';return;}
  const cur=Object.fromEntries((SYNC.records||[]).map(r=>[r.id,r]));let n=0,fail=0;
  for(const r of out){const id=(r.kind==='game'?'game-':'imp-')+r.set+'-'+hashS((r.sid||'')+'|'+r.name.replace(/\s+/g,''));const old=cur[id];let body;
    if(r.kind==='game'){if(old&&old.at>=r.at)continue;body={kind:'game',set:r.set,name:r.name,sid:r.sid,stars:r.stars,cleared:r.cleared,so:r.so,at:r.at,src:'form'};}
    else{const best={...(old&&old.best||{})};const hist=(old&&old.history||[]).slice();for(const m of Object.keys(r.best)){const b=r.best[m];if(better(best[m],b))best[m]={...b,code:'FORM',at:r.at};if(!hist.some(h=>h.mod===m&&h.at===r.at))hist.push({mod:m,score:b.score,total:b.total,pass:b.pass,code:'FORM',at:r.at});}
      body={name:r.name+(r.set==='S'?' (ย่อ)':''),sid:r.sid,set:r.set,best,history:hist.slice(-60),at:Math.max(r.at,old&&old.at||0),src:'form'};}
    cur[id]={id,...body};try{await SYNC.db.doc('records/'+id).set(body);n++;}catch(e){fail++;}}
  st.textContent=`นำเข้า/อัปเดต ${n} รายการ${fail?` · บันทึกไม่สำเร็จ ${fail}`:''}${bad.length?` · ข้ามรหัสที่ถูกแก้ไข ${bad.length}`:''}`;if(!n&&!fail)st.textContent+=' (ข้อมูลเป็นปัจจุบันแล้ว)';$('#imptxt').value='';}
function renderIns(){if(APP.mod!=='ins')return;const box=$('#insbox');if(!box)return;
  if(!SYNC.records){box.innerHTML='<p class="muted">กำลังโหลดข้อมูลผู้รับการฝึก…</p>';return;}
  const rows=insRows().filter(r=>!insQ||(r.name+' '+(r.sid||'')).toLowerCase().includes(insQ.toLowerCase())).sort((a,b)=>String(a.sid||a.name).localeCompare(String(b.sid||b.name),'th',{numeric:true}));
  const all=insRows(),n=all.length,ready=all.filter(r=>r.passed===6).length,avg=n?Math.round(all.reduce((a,r)=>a+r.pct,0)/n*100):0;
  const modStat=MODS.filter(m=>m.n).map(m=>{const done=all.filter(r=>r.best&&r.best[m.id]),pass=done.filter(r=>r.best[m.id].pass).length;return{m,done:done.length,pass};});
  box.innerHTML=`<div class="row" style="gap:16px"><div><div class="score mono">${n}</div><div class="muted">ผู้รับการฝึกที่ส่งคะแนน</div></div><div><div class="score mono">${ready}</div><div class="muted">ผ่านครบ 6 โมดูล</div></div><div><div class="score mono">${avg}%</div><div class="muted">คะแนนเฉลี่ย</div></div></div>
    <h3>อัตราผ่านรายโมดูล</h3><div style="display:grid;gap:5px">${modStat.map(s=>`<div style="display:grid;grid-template-columns:150px 1fr 60px;gap:8px;align-items:center;font-size:13.5px"><span>${s.m.n} ${s.m.t}</span><span style="height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden"><span style="display:block;height:100%;width:${n?s.pass/n*100:0}%;background:var(--good)"></span></span><span class="mono">${s.pass}/${n}</span></div>`).join('')}</div>
    <h3>รายบุคคล</h3><div class="row"><div class="field"><label for="insq">ค้นหาชื่อ/รหัส</label><input id="insq" value="${esc(insQ)}" style="font-family:var(--f-body)"></div></div>
    <div class="wrapx" style="margin-top:8px"><table><tr><th>รหัส</th><th>ชื่อ</th>${MODN.map((m,k)=>`<th>${k+1}</th>`).join('')}<th>ผ่าน</th><th>ล่าสุด</th></tr>
    ${rows.map(r=>{const b=r.best||{};return`<tr data-id="${esc(r.id)}" style="cursor:pointer" class="${insSel===r.id?'sel':''}"><td class="mono">${esc(r.sid||'')}</td><td>${esc(r.name||'(ไม่ระบุ)')}</td>${MODN.map(m=>`<td class="mono" style="color:${b[m]?(b[m].pass?'var(--good)':'var(--bad)'):'var(--muted)'}">${b[m]?Math.round(b[m].score/b[m].total*100):'–'}</td>`).join('')}<td class="mono">${r.passed}/6</td><td class="mono" style="font-size:12px">${r.at?new Date(r.at).toLocaleDateString('th-TH'):''}</td></tr>`;}).join('')||'<tr><td colspan="10" class="muted">ยังไม่มีผู้รับการฝึกส่งคะแนน</td></tr>'}</table></div>
    ${gameTable()}<p class="muted" style="font-size:12.5px">ตัวเลขคือ % คะแนนดีที่สุด เขียว = ผ่าน แดง = ยังไม่ผ่าน · แตะแถวเพื่อดูประวัติ</p><div id="insdet"></div>`;
  const q=$('#insq');if(q)q.addEventListener('change',e=>{insQ=e.target.value;renderIns();});
  box.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>{insSel=tr.dataset.id;renderDet();});renderDet();}
function gameTable(){const g=(SYNC.records||[]).filter(r=>r.kind==='game').sort((a,b)=>(b.stars||0)-(a.stars||0));if(!g.length)return'';
  return`<h3>ผลเกม (จาก Google Form)</h3><div class="wrapx"><table><tr><th>ชื่อ</th><th>ภารกิจที่ผ่าน</th><th>ดาว</th><th>Score-O</th></tr>${g.map(r=>`<tr><td>${esc(r.name)}${r.set==='S'?' (ย่อ)':''}</td><td class="mono">${r.cleared}/${r.set==='S'?7:12}</td><td class="mono">★ ${r.stars}</td><td class="mono" style="font-size:12px">${esc(r.so||'')}</td></tr>`).join('')}</table></div>`;}
function renderDet(){const el=$('#insdet');if(!el||!insSel)return;const r=insRows().find(x=>x.id===insSel);if(!r){el.innerHTML='';return;}
  const T=Object.fromEntries(MODS.map(m=>[m.id,m.n+' '+m.t]));
  el.innerHTML=`<h3>ประวัติ: ${esc(r.name||'')} ${r.sid?'('+esc(r.sid)+')':''}</h3><ul class="log">${(r.history||[]).slice().reverse().map(h=>`<li>${new Date(h.at).toLocaleString('th-TH')} · ${esc(T[h.mod]||h.mod)} · <b>${h.score}/${h.total}</b> ${h.pass?'ผ่าน':'ไม่ผ่าน'} · <span class="mono">${esc(h.code||'')}</span></li>`).join('')||'<li>ไม่มีประวัติ</li>'}</ul>`;}
MOD.ins={start(){fitView();setSheet(`<div class="eyebrow">สำหรับครูฝึก</div><h2>สรุปคะแนนผู้รับการฝึก</h2>
  <div class="tools"><button class="btn primary" id="csv1">ดาวน์โหลดสรุป (CSV)</button><button class="btn" id="csv2">ดาวน์โหลดประวัติทั้งหมด (CSV)</button></div><p class="muted" id="insmsg" style="font-size:13px">ข้อมูลอัปเดตสดเมื่อผู้รับการฝึกจบแต่ละโมดูล · ผู้รับการฝึกเห็นเฉพาะคะแนนของตนเอง</p>
  <details style="margin:8px 0;padding:8px 12px;border:1px solid var(--line);border-radius:10px"><summary><b>ตรวจสอบ/นำเข้าผลจาก Google Sheets</b></summary>
  <p class="muted" style="font-size:13px">ในชีตคำตอบของ Google Form เลือกคอลัมน์ "รหัสตรวจสอบ" ทั้งคอลัมน์ (แบบฝึกและเกม) คัดลอกมาวางที่นี่ ระบบจะตรวจว่ามีใครแก้คะแนนในฟอร์มหรือไม่ แล้วรวมเข้าตารางด้านล่าง</p>
  <textarea id="imptxt" rows="5" style="width:100%;font-size:13px" placeholder="วางคอลัมน์รหัสตรวจสอบที่นี่"></textarea><div class="tools"><button class="btn primary" id="impgo">นำเข้า</button></div><p class="muted" id="impmsg" style="font-size:13px"></p></details>
  <div id="insbox"></div>`);
  on('impgo',importCodes);on('csv1',()=>saveCSV('sum'));on('csv2',()=>saveCSV('hist'));renderIns();}};

/* ---------- map margin ---------- */
MOD.leg={start(){fitView();const v0=W.villages[0];
  setSheet(`<div class="eyebrow">ขอบระวาง · รหัสภารกิจ <span class="mono">${esc(APP.code)}</span></div><h2>ระวาง${esc(v0?v0.name:'จำลอง')} (จำลอง)</h2>
    <table><tr><td>มาตราส่วน</td><td class="mono">1:50,000 (1 ช่องกริด = 1 กม. · 1 ซม. = 500 ม.)</td></tr><tr><td>เขตกริด</td><td class="mono">${ZONE} · WGS84 · UTM</td></tr><tr><td>ช่วงเส้นชั้นความสูง</td><td class="mono">20 ม. (เส้นแทรก 10 ม.)</td></tr>
    <tr><td>พิกัดภูมิศาสตร์</td><td class="mono">${fmtDMS(latSecAt(0),'N')} – ${fmtDMS(latSecAt(MAP),'N')}<br>${fmtDMS(lonSecAt(0),'E')} – ${fmtDMS(lonSecAt(MAP),'E')}</td></tr><tr><td>พื้นที่กริด</td><td class="mono">${E0/1000}-${E0/1000+8} / ${N0/1000}-${N0/1000+8}</td></tr></table>
    <h3>แผนภาพมุมเบี่ยงเบน</h3>${declHTML()}
    <h3>เครื่องหมายแผนที่</h3><div class="legend">${LEG.map(([k,t])=>`<div><canvas data-k="${k}" aria-hidden="true"></canvas><span>${t}</span></div>`).join('')}</div>
    <p class="muted" style="margin-top:12px">พื้นที่ แผนที่ และมุมเบี่ยงเบนสร้างจากรหัสภารกิจ ทุกคนที่ใช้รหัสเดียวกันจะได้ระวางเดียวกัน</p>`);
  sheet.querySelectorAll('.legend canvas').forEach(cv=>drawLeg(cv,cv.dataset.k));}};

/* ---------- boot ---------- */
APP.store=loadStore();
(async()=>{try{if(!window.claude||!window.claude.use){if(!lsGet('lnav-name',''))setModule('res');return;}const[db,user,dl]=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')]);SYNC.dl=dl;if(!db){if(!lsGet('lnav-name',''))setModule('res');return;}SYNC.db=db;
  SYNC.uid=user?await user.id():null;SYNC.owner=user?await user.isOwner():false;
  if(SYNC.owner){MODS.push({id:'ins',n:'',t:'ครูฝึก'});renderTabs();db.collection('records').limit(500).onSnapshot(s=>{SYNC.records=s.docs.map(d=>({id:d.id,...d.data()}));renderIns();},()=>{});}
  else if(!lsGet('lnav-name',''))setModule('res');
  pushRecord();if(APP.mod==='res')syncStatus();}catch(e){}})();try{const c=localStorage.getItem('lnav-code');if(c)$('#code').value=c;}catch(e){}
new ResizeObserver(resize).observe($('#stage'));window.addEventListener('resize',resize);
resize();regen();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>requestDraw());

})();
