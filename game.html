<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f3d27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>ปฏิบัติการเข็มทิศ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one dark tactical world — map/compass stage fills the screen, the mission HUD docks below on phones and to the right on wide screens */
:root{
  --bg:#0e120f; --surface:#151b16; --surface-2:#1d251e; --surface-3:#26302700; --ink:#e9eddf; --muted:#93a08b; --line:#2b362c;
  --accent:#f0b03a; --accent-ink:#1b1404; --accent-soft:#3a2e12;
  --good:#86d474; --bad:#ff6f5e; --star:#f0b03a; --star-off:#3a443a;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px 14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.brand em{font-style:normal;color:var(--accent)}
.rankchip{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font-size:13.5px}
.rankchip b{font-family:var(--f-display);font-weight:600}
.rankchip .st{color:var(--star);font-family:var(--f-mono);font-size:13px}
.mission{display:flex;align-items:center;gap:6px;margin-left:auto}
.mission label{font-size:12px;color:var(--muted)}
.mission input{width:7.5em;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-family:var(--f-mono);font-size:14px;text-transform:uppercase}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 12px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;padding:0}
.tabs{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 14px;font-size:14px;white-space:nowrap;font-family:var(--f-display);font-weight:600;letter-spacing:.02em}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stage{position:relative;min-height:0;overflow:hidden;background:#d9d3c0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#comp{position:absolute;inset:0;display:grid;grid-template-rows:36% 64%;touch-action:none;background:#11140f}
#comp canvas{width:100%;height:100%;display:block;touch-action:none}
.stagebar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.stagebar .btn{background:rgba(251,252,247,.92);color:#1b2117;border-color:rgba(0,0,0,.18);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.viewseg{position:absolute;left:10px;top:10px;z-index:2;display:flex;border-radius:8px;overflow:hidden;border:1px solid rgba(0,0,0,.25);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.viewseg button{border:0;padding:6px 12px;background:rgba(251,252,247,.92);color:#1b2117;font-size:14px}
.viewseg button[aria-pressed="true"]{background:#2f3b26;color:#f0b03a}
.turnbar{position:absolute;left:0;right:0;bottom:12px;padding-inline:12px;display:flex;justify-content:space-between;gap:10px;z-index:2;pointer-events:none}
.turnbar span{pointer-events:auto}
.turnbar .btn{pointer-events:auto;background:rgba(20,24,18,.85);color:#e8eadf;border-color:rgba(255,255,255,.2)}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:52px;font-size:12px;color:#c9cfbf;background:rgba(0,0,0,.5);padding:3px 10px;border-radius:999px;z-index:2;white-space:nowrap}
.compbar{position:absolute;right:10px;top:10px;z-index:2;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.compbar .seg{display:flex;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.compbar .seg button{border:0;padding:6px 10px;background:rgba(20,24,18,.85);color:#e8eadf;font-size:13.5px}
.compbar .seg button[aria-pressed="true"]{background:#2f3b26;color:#fff}
.compbar .bz{display:flex;gap:6px}
.compbar .bz .btn{background:rgba(20,24,18,.85);color:#e8eadf;border-color:rgba(255,255,255,.25);font-size:13.5px;padding:6px 10px}
.hint{top:auto!important;bottom:18px;white-space:normal!important;max-width:40%;text-align:center}
.flash{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .35s}
.flash.ok{background:radial-gradient(circle,transparent 55%,rgba(134,212,116,.45));opacity:1}
.flash.bad{background:radial-gradient(circle,transparent 55%,rgba(255,111,94,.45));opacity:1}

.sheet{min-width:0;background:var(--surface);border-top:1px solid var(--line);padding-block:14px 18px;padding-inline:16px;overflow-y:auto;max-height:48vh}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:21px;margin:0 0 2px;letter-spacing:.01em;text-wrap:balance}
.sheet h3{font-family:var(--f-display);font-weight:600;font-size:16px;margin:16px 0 6px;letter-spacing:.02em}
.sheet p{margin:6px 0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-family:var(--f-mono)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hud .lvl{font-family:var(--f-display);font-weight:600;font-size:15px;margin-right:auto}
.hud .pts{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--accent)}
.combo{font-family:var(--f-mono);font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.combo:empty{display:none}
.tbar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:8px 0 10px}
.tbar span{display:block;height:100%;background:var(--accent);transition:width .2s linear}
.tbar.low span{background:var(--bad)}
.q{font-size:16.5px;font-weight:500}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.choices button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:11px 10px;text-align:left}
.choices button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,transparent)}
.choices button.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 130px}
.field label{font-size:12.5px;color:var(--muted)}
.field input,.field select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-family:var(--f-mono);font-size:16px;min-width:0;width:100%}
.field input.ok{border-color:var(--good)} .field input.no{border-color:var(--bad)}
.fb{margin-top:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:14.5px}
.fb.good{border-color:var(--good);color:var(--good)}
.fb.bad{border-color:var(--bad)} .fb.bad strong{color:var(--bad)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tools .btn{font-size:13.5px;padding:6px 10px}
.tools .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
details{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:13.5px}
details ol,details ul{margin:6px 0;padding-left:20px;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.03em}
tr.me td{background:var(--accent-soft)}
.wrapx{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12.5px;border:1px solid var(--line)}
.pill.pass{border-color:var(--good);color:var(--good)}
.pill.fail{border-color:var(--bad);color:var(--bad)}
.stars{color:var(--star);letter-spacing:2px;font-size:15px}
.stars i{font-style:normal;color:var(--star-off)}
.levels{display:grid;gap:8px;margin-top:10px}
.lv{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;text-align:left;width:100%}
.lv .no{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--accent);text-align:center}
.lv .nm{font-family:var(--f-display);font-weight:600;font-size:16px;display:block}
.lv .sb{font-size:13px;color:var(--muted);display:block}
.lv:disabled{opacity:.5}
.lv:disabled .no{color:var(--muted)}
.rankcard{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,var(--surface-2),var(--surface))}
.rankcard .big{font-family:var(--f-display);font-weight:700;font-size:22px}
.meter{height:6px;background:var(--bg);border-radius:999px;overflow:hidden;margin-top:6px}
.meter span{display:block;height:100%;background:var(--accent)}
.result{text-align:center;padding:6px 0}
.result .bigstars{font-size:44px;letter-spacing:6px;color:var(--star);line-height:1.1}
.result .bigstars i{font-style:normal;color:var(--star-off)}
.result .score{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1.1}
.promo{margin:10px auto 0;max-width:340px;padding:10px;border:1px solid var(--accent);border-radius:10px;color:var(--accent);font-family:var(--f-display);font-weight:600}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
.bigstars b{display:inline-block;font-weight:400;animation:pop .45s both}
.bigstars b:nth-child(2){animation-delay:.18s}.bigstars b:nth-child(3){animation-delay:.36s}
.flaglist{display:grid;grid-template-columns:auto 1fr auto auto;gap:3px 10px;font-size:14px;margin-top:6px;align-items:center}
.log{font-size:13.5px;margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.log li{padding:5px 8px;background:var(--surface-2);border-radius:6px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;margin-top:6px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.legend canvas{width:40px;height:22px;background:#f5f0e1;border-radius:3px;border:1px solid var(--line);flex:none}
@media (min-width:900px){
  body{grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto auto minmax(0,1fr)}
  .top,.tabs{grid-column:1 / -1}
  .stage{grid-column:1;grid-row:3}
  .sheet{grid-column:2;grid-row:3;max-height:none;border-top:0;border-left:1px solid var(--line)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.mappal{position:absolute;left:10px;top:10px;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:calc(100% - 74px);padding:6px 8px;border-radius:10px;background:rgba(251,252,247,.95);color:#1b2117;box-shadow:0 1px 4px rgba(0,0,0,.25);font-size:12.5px}
.mappal[hidden]{display:none}.mappal .pl{color:#4a5544;font-size:12px}.mappal .sep{width:1px;height:22px;background:rgba(0,0,0,.15)}
.mappal .sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.3);padding:0}
.mappal .sw.on{box-shadow:0 0 0 3px #1b2117}
.mappal .ub{width:40px;height:40px;padding:2px;border-radius:8px;border:1px solid rgba(0,0,0,.18);background:#fff;display:grid;place-items:center}
.mappal .ub.on{border:2px solid #1b2117;background:#eef2e6}.mappal .ub canvas{pointer-events:none}
.mappal .pb{border:1px solid rgba(0,0,0,.2);background:#fff;color:#1b2117;border-radius:7px;padding:4px 8px;font-size:12.5px}
@media (max-width:600px){.mappal{gap:4px;padding:4px 6px;max-width:calc(100% - 64px)}.mappal .ub{width:32px;height:32px}.mappal .ub canvas{width:28px!important;height:28px!important}.mappal .sw{width:22px;height:22px}.mappal .phint{display:none}}
.stagebar .plock[aria-pressed="true"]{background:#2f3d27;color:#fff;border-color:#2f3d27}
@media (max-width:899px){#comp{grid-template-rows:48% 52%}}
@media (max-width:899px){body.comp-on .sheet{max-height:31vh!important;max-height:31dvh!important}body.comp-big .sheet{max-height:22vh!important;max-height:22dvh!important}body.comp-big{grid-template-rows:auto minmax(0,1fr) auto!important}body.comp-big header.top{display:none!important}}#comp{bottom:56px!important}.turnbar{bottom:0!important;padding:8px 12px!important;background:#11140f;align-items:center}.turnbar .btn{min-height:40px}#turnhint{bottom:16px!important;max-width:38%!important;font-size:11px}.compbar #cbig[aria-pressed="true"]{background:#4b6a2e;color:#fff}[hidden]{display:none!important}body{margin:0}.homebtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);text-decoration:none;color:inherit;margin-right:6px;flex:none}</style>
<script src="config.js"></script>
</head>
<body>


<header class="top">
  <div class="brand"><a class="homebtn" href="./" aria-label="หน้าแรก" title="หน้าแรก">⌂</a>
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="#f0b03a" stroke-width="1.6"/><path d="M13 3.5 16 13h-6z" fill="#ff6f5e"/><path d="M13 22.5 10 13h6z" fill="#e9eddf"/></svg>
    <span>ปฏิบัติการ<em>เข็มทิศ</em></span>
  </div>
  <div class="rankchip" id="rankchip"></div>
  <div class="mission">
    <label for="code">รหัสภารกิจ</label>
    <input id="code" value="ALPHA-01" maxlength="16" autocomplete="off" spellcheck="false">
    <button class="btn" id="gen">สร้างพื้นที่</button>
    <button class="btn iconbtn" id="snd" aria-pressed="true" aria-label="เสียง" title="เปิด/ปิดเสียง">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 7h3l4-3v10l-4-3H2z" fill="currentColor"/><path id="sndwave" d="M12 6.5c1.2 1.4 1.2 3.6 0 5M14 4.5c2.3 2.6 2.3 6.4 0 9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main class="stage" id="stage">
  <canvas id="map" aria-label="แผนที่ภูมิประเทศจำลอง"></canvas>
  <div id="comp" hidden><canvas id="pano" aria-label="ภาพรอบตัว"></canvas><canvas id="dial" aria-label="เข็มทิศเลนเซติก"></canvas></div>
  <div class="viewseg" id="viewseg" hidden><button id="vMap" aria-pressed="true">แผนที่</button><button id="vComp" aria-pressed="false">เข็มทิศ</button></div>
  <div class="stagebar" id="zoombar">
    <button class="btn iconbtn" id="zin" aria-label="ขยาย">+</button>
    <button class="btn iconbtn" id="zout" aria-label="ย่อ">−</button>
    <button class="btn iconbtn" id="zfit" aria-label="ดูทั้งระวาง"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
  </div>
  <div class="turnbar" id="turnbar" hidden>
    <span style="display:flex;gap:8px"><button class="btn" id="tl2" aria-label="หมุนซ้าย 10 องศา">◀◀</button><button class="btn" id="tl1" aria-label="หมุนซ้ายเล็กน้อย">◀</button></span>
    <span style="display:flex;gap:8px"><button class="btn" id="tr1" aria-label="หมุนขวาเล็กน้อย">▶</button><button class="btn" id="tr2" aria-label="หมุนขวา 10 องศา">▶▶</button></span>
  </div>
  <div class="compbar" id="compbar" hidden>
    <div class="seg"><button id="cmSight" aria-pressed="false">ยกขึ้นเล็ง</button><button id="cmTop" aria-pressed="true">มองหน้าปัด</button></div>
    <div class="bz" id="bzbar"><button class="btn" id="bzL" aria-label="หมุนวงแหวนทวนเข็ม 1 คลิก">↺ คลิก</button><button class="btn" id="bzR" aria-label="หมุนวงแหวนตามเข็ม 1 คลิก">คลิก ↻</button></div>
  </div>
  <div class="hint" id="turnhint" hidden>ลากซ้าย-ขวาเพื่อหมุนตัว</div>
  <div class="flash" id="flash"></div>
</main>
<section class="sheet" id="sheet" aria-live="polite"></section>

<script>
(function(){
'use strict';
const CFG={short:false,web:true,form:{url:'',e:{}}};
/* ================= SHARED CORE: world, map, tools, lensatic compass ================= */
/* ---------- constants & helpers ---------- */
const MAP=8000, E0=40000, N0=20000, ZONE='47P PS', MPD=6400/360;
const FOVS=[30,45,60,90];let FOVI=(typeof window!=='undefined'&&window.innerWidth<700)?2:1,FOV=FOVS[FOVI];
const LAT0=14+15/60, LON0=99+30/60, M_LAT=110600, M_LON=107870; // SW corner of the sheet, metres per degree
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hyp=Math.hypot;
const wrap360=a=>((a%360)+360)%360;
const wrapMil=a=>((a%6400)+6400)%6400;
const angDiff=(a,b,m)=>{m=m||360;return ((a-b)%m+m*1.5)%m-m/2;};
const RNG={f:Math.random};const rnd=(a,b)=>a+RNG.f()*(b-a);
const pick=a=>a[(RNG.f()*a.length)|0];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(RNG.f()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hashStr(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gaussR(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const gauss=()=>gaussR(()=>RNG.f());
function makeNoise(r){
  const q=[...Array(256).keys()];for(let i=255;i>0;i--){const j=(r()*(i+1))|0;[q[i],q[j]]=[q[j],q[i]];}
  const p=new Uint8Array(512);for(let i=0;i<512;i++)p[i]=q[i&255];

  temple(c,x,y,s){c.fillStyle='#1a1a1a';c.fillRect(x-s*.6,y,s*1.2,s*.55);c.beginPath();c.moveTo(x-s*.8,y);c.lineTo(x,y-s*.9);c.lineTo(x+s*.8,y);c.closePath();c.fill();c.fillRect(x-.6,y-s*1.5,1.2,s*.7);},
  school(c,x,y,s){c.fillStyle='#1a1a1a';c.fillRect(x-s*.55,y-s*.1,s*1.1,s*.75);c.fillRect(x-.6,y-s*1.3,1.3,s*1.2);c.beginPath();c.moveTo(x+.7,y-s*1.3);c.lineTo(x+s*.85,y-s*1.05);c.lineTo(x+.7,y-s*.8);c.fill();},
  hospital(c,x,y,s){c.fillStyle='#1a1a1a';c.fillRect(x-s*.18,y-s*.6,s*.36,s*1.2);c.fillRect(x-s*.6,y-s*.18,s*1.2,s*.36);},

    c.beginPath();c.arc(x,y-s*.8,s*.55,-2.6,-.55);c.stroke();c.fillStyle='#1a1a1a';c.beginPath();c.arc(x,y-s*.8,1.6,0,7);c.fill();},
  spot(c,x,y,s,trig){c.fillStyle='#5b3214';if(trig){c.strokeStyle='#1a1a1a';c.lineWidth=1.2;c.beginPath();c.moveTo(x,y-s*.75);c.lineTo(x+s*.7,y+s*.5);c.lineTo(x-s*.7,y+s*.5);c.closePath();c.stroke();c.fillStyle='#1a1a1a';}c.beginPath();c.arc(x,y,1.8,0,7);c.fill();},
  marsh(c,x,y,s){c.strokeStyle='#2f78b8';c.lineWidth=1.1;c.beginPath();c.moveTo(x-s*.6,y);c.lineTo(x+s*.6,y);for(const dx of[-.35,0,.35]){c.moveTo(x+dx*s,y);c.lineTo(x+dx*s,y-s*.45);}c.stroke();},
  pond(c,x,y,s){c.fillStyle='#9fcbea';c.strokeStyle='#3584c6';c.lineWidth=1;c.beginPath();c.ellipse(x,y,s*.75,s*.5,0,0,7);c.fill();c.stroke();},
  orchard(c,x,y){c.fillStyle='#3d7a2a';for(const[dx,dy]of[[-3,-2],[3,-2],[0,3]]){c.beginPath();c.arc(x+dx,y+dy,1.3,0,7);c.fill();}},
  paddy(c,x,y){c.strokeStyle='#4f8a3a';c.lineWidth=1;c.beginPath();for(const dx of[-3,0,3]){c.moveTo(x+dx,y+2);c.lineTo(x+dx*1.4,y-3);}c.moveTo(x-5,y+2);c.lineTo(x+5,y+2);c.stroke();},
};

    el.innerHTML='<div class="nt" id="ndt" role="button" tabindex="0" title="แตะเพื่อย่อ/ขยายแผงลูกศร"></div><span></span><button data-d="0,1" aria-label="เลื่อนหมุดขึ้น (เหนือ)">▲</button><span></span><button data-d="-1,0" aria-label="เลื่อนหมุดซ้าย (ตะวันตก)">◀</button><button class="nc" id="ndc" aria-label="ไปที่หมุด">หมุด</button><button data-d="1,0" aria-label="เลื่อนหมุดขวา (ตะวันออก)">▶</button><span></span><button data-d="0,-1" aria-label="เลื่อนหมุดลง (ใต้)">▼</button><span></span><button class="ns" id="nds"></button>';

/* ---------- tolerances: lenient pass, always show the true value and why ---------- */
const TOL={g8:2,az:3,dist:0.08,distMin:40,comp:4,compNight:5,geo:8,plot:40,find:100,fixFull:150,fixHalf:300};
function gridCheck(ans,p,d){ // ans = digits typed; returns {ok,exact,de,dn,truth,msg}
  const h=d/2,mod=Math.pow(10,h),truth=gridRef(p.x,p.y,d).replace(' ',''),te=+truth.slice(0,h),tn=+truth.slice(h),ae=+ans.slice(0,h),an=+ans.slice(h);
  const wr=v=>{v=((v%mod)+mod)%mod;return v>mod/2?v-mod:v;};const de=wr(ae-te),dn=wr(an-tn),tol=d===8?TOL.g8:0,unit=d===8?10:100;
  const ok=Math.abs(de)<=tol&&Math.abs(dn)<=tol,exact=de===0&&dn===0;const tips=[];
  const swapped=ans.slice(0,h)===truth.slice(h)&&ans.slice(h)===truth.slice(0,h);
  if(swapped&&!exact)tips.push('สลับลำดับ: ต้องอ่าน<b>ขวา</b> (ตัวเลขเส้นกริดตั้ง ขอบบน/ล่าง) ก่อน แล้วจึงอ่าน<b>ขึ้น</b> (เส้นกริดราบ ขอบซ้าย/ขวา)');
  else{const ax=(v,nm,big)=>{if(Math.abs(v)<=tol)return;const m=Math.abs(v)*unit;
      if(d===8&&Math.abs(v)%10===0)tips.push(`${nm}คลาด ${m} ม. พอดี 1 ช่องกริด: ใช้เส้นกริดเส้นผิด ต้องใช้เส้นที่อยู่${big}ของจุด`);
      else if(d===8&&Math.abs(v)<10)tips.push(`${nm}คลาด ${m} ม.: ขยายแผนที่ แล้วประมาณสัดส่วนภายในช่อง 100 ม. ให้ละเอียดขึ้น (แบ่ง 10 ส่วน) หรือวางมุมไม้วัดพิกัดทับจุดพอดี`);
      else if(d===6&&Math.abs(v)===1)tips.push(`${nm}คลาด 1 ช่อง (100 ม.): ใช้ค่าของเส้นกริดที่อยู่${big}ของจุดเสมอ ไม่ปัดขึ้น`);
      else tips.push(`${nm}คลาด ${m.toLocaleString()} ม.: ตรวจตัวเลขใหญ่ 2 หลักของเส้นกริด`);};
    ax(de,'ค่าตะวันออก (ขวา) ','ทางซ้าย');ax(dn,'ค่าเหนือ (ขึ้น) ','ทางใต้');}
  const sg=v=>(v>0?'+':'')+v;
  const msg=`ค่าจริง <span class="mono">${ZONE} ${gridRef(p.x,p.y,d)}</span> · คุณตอบ <span class="mono">${ans.slice(0,h)} ${ans.slice(h)}</span>`+(exact||swapped?'':` (ขวา ${sg(de)} · ขึ้น ${sg(dn)} หลัก = ${Math.abs(de)*unit} / ${Math.abs(dn)*unit} ม.)`)
    +(ok&&!exact?`<br><span class="muted">ผ่าน: ${d}-หลักยอมคลาดได้ ±${tol} ในหลักสุดท้าย (±${tol*unit} ม.) ทั้งแนวตั้งและแนวนอน</span>`:'')+(tips.length?'<br>'+tips.map(t=>'• '+t).join('<br>'):'');
  return{ok,exact,de,dn,truth,msg};}
function compassTip(ans,truth){const e=angDiff(ans,truth),a=Math.abs(e),t=[];
  if(ans>360)t.push('ค่าเกิน 360 น่าจะอ่านเป็น<b>มิล</b> (ตัวเลขดำวงนอก) ให้อ่านตัวเลข<b>สีแดง</b> (องศา)');
  else if(a>=170)t.push('คลาดเกือบ 180°: น่าจะอ่านมุมกลับ หรือหันผิดด้าน');
  else if(a>TOL.comp)t.push('ให้เส้นเล็งในช่องเล็งหลังทับที่หมายพอดี รอหน้าปัดนิ่งก่อนอ่าน แล้วอ่านค่าใต้เส้นดัชนี');
  return t.length?'<br>• '+t.join('<br>• '):'';}
function angTip(ans,truth,label){const a=Math.abs(angDiff(ans,truth));if(a<=TOL.az)return'';
  if(a>=170)return`<br>• ${label}คลาดเกือบ 180°: วัดกลับทิศ ต้องวัดจากจุดเริ่ม (A) ไปจุดปลาย (B)`;
  if(Math.abs(a-90)<=6)return`<br>• ${label}คลาดราว 90°: ตรวจว่าแนว N-S ของแผ่นวัดมุมขนานกับเส้นกริดตั้ง และอ่านมาตราที่ถูกด้าน`;
  return`<br>• ${label}คลาด ${Math.round(a)}°: วางจุดกึ่งกลางแผ่นทับจุดเริ่มพอดี ให้เส้น N-S ขนานเส้นกริด แล้วอ่านตรงที่เส้นดินสอตัดขอบแผ่น`;}
function distTip(ans,truth){if(Math.abs(ans-truth)<=Math.max(truth*TOL.dist,TOL.distMin))return'';const r=ans/truth;
  if(Math.abs(r-2)<0.15||Math.abs(r-0.5)<0.08)return'<br>• ระยะคลาดเท่าตัว: ตรวจมาตราส่วน 1:50,000 (1 ซม. บนแผนที่ = 500 ม.) และหน่วยที่ใช้';
  if(Math.abs(r-10)<1||Math.abs(r-0.1)<0.01)return'<br>• ระยะคลาด 10 เท่า: ตรวจหน่วย เมตร/กิโลเมตร';
  return`<br>• ระยะคลาด ${Math.round(Math.abs(ans-truth))} ม.: วางขอบเข็มทิศให้ขีด 0 อยู่ที่จุดเริ่มพอดี แล้วอ่านที่จุดปลาย (ช่องกริด 1 ช่อง = 1,000 ม. ใช้เทียบได้)`;}
const navBand=d=>d<=200?'ใกล้มาก (ไม่เกิน 200 ม.)':d<=500?'ห่างราว 200-500 ม.':d<=1000?'ห่างราว 500 ม.-1 กม.':'ห่างเกิน 1 กม.';
function searchHelp(d,az,nFail){const t=[`จุดตรวจอยู่ <b>${navBand(d)}</b>`];
  if(d<=200)t.push('ค้นหาเป็นรูปกล่อง: เดินออก 50-100 ม. ทีละทิศ แล้วกดค้นหา');
  else t.push('ตรวจตำแหน่งตัวเองก่อน: "สังเกตรอบตัว" หรือส่องเข็มทิศหายอดเขาแล้วสกัดกลับ จากนั้นวัดมุมและระยะใหม่จากตำแหน่งนั้น');
  if(nFail>=2)t.push(`คำใบ้: ไปทาง<b>${dir8(az)}</b> ประมาณ ${Math.max(100,Math.round(d/100)*100).toLocaleString()} ม.`);
  return t.join(' · ');}
function legReview(legs,pace){ // legs: {from, pp, az, paces, cnt, end, tgt, label}
  if(!legs.length)return'';const rows=legs.map((L,k)=>{if(!L.tgt)return'';const t=[],azT=gridAz(L.pp,L.tgt),dT=dist(L.pp,L.tgt),posErr=dist(L.pp,L.from);
    const plan={x:L.from.x+Math.sin(L.az*Math.PI/180)*L.cnt,y:L.from.y+Math.cos(L.az*Math.PI/180)*L.cnt},drift=dist(plan,L.end),azE=angDiff(L.az,azT),dE=L.cnt-dT,miss=dist(L.end,L.tgt);
    if(posErr>100)t.push(`ก่อนเริ่มขานี้ ตำแหน่งที่คุณคิดว่าอยู่คลาดจากจริง ${Math.round(posErr)} ม. ควรหาที่อยู่ตัวเอง (สกัดกลับ) ก่อนวางแผนต่อ`);
    if(Math.abs(azE)>TOL.az)t.push(`มุมคลาด ${azE>0?'+':''}${Math.round(azE)}° (ควรเป็น ${fd(azT)}°)${Math.abs(azE)>=170?' — วัดกลับทิศ':' — วัดมุมใหม่: แผ่นวัดมุมทับจุดเริ่ม เส้น N-S ขนานเส้นกริด'}`);
    if(Math.abs(dE)>Math.max(dT*0.1,60))t.push(`ระยะ${dE>0?'เกิน':'ขาด'} ${Math.round(Math.abs(dE))} ม. (ควรเดิน ${Math.round(dT)} ม. = ${Math.round(dT*pace/100)} ก้าว · สูตร ระยะ × ${pace} ÷ 100)`);
    if(drift>Math.max(60,L.cnt*0.04))t.push(`เดินเบี่ยงจากแนวที่ตั้งใจ ${Math.round(drift)} ม. (ป่า ทางลาดชัน และก้าวจริงที่ต่างจากก้าวมาตรฐาน) — ขาที่ยาวควรแบ่งเป็นช่วงสั้นๆ และหาจุดสังเกตตรวจระหว่างทาง`);
    const ok=miss<=TOL.find;
    return`<li><b>ขา ${k+1}</b> → ${esc(L.label)}: ตั้ง ${fd(L.az)}° นับ ${L.paces} ก้าว (≈${Math.round(L.cnt)} ม.) · ค่าที่ถูกจากจุดเริ่มที่คุณคิด: <span class="mono">${fd(azT)}° · ${Math.round(dT)} ม.</span> · จบห่าง ${esc(L.label)} <b>${Math.round(miss)} ม.</b> ${ok?'<span class="pill pass">ถึงเป้า</span>':''}${t.length?'<br><span class="muted">'+t.join('<br>')+'</span>':(ok?'':'<br><span class="muted">มุมและระยะใกล้เคียง ความคลาดมาจากการเดิน ใช้การค้นหารอบจุดหรือสกัดกลับช่วย</span>')}</li>`;}).join('');
  return`<h3>วิเคราะห์ทีละขา</h3><ul class="log" style="font-size:13.5px">${rows}</ul>`;}

let raf=0;function requestDraw(){if(!raf)raf=requestAnimationFrame(frame);}
function frame(){raf=0;palette();plateLockUI();nudgeUI();if(APP.view==='map')drawMap();else{const anim=stepCard();drawPano();drawDial();if(anim)requestDraw();}}
let VT={ox:0,oy:0,z:1};
const S2=(x,y)=>[x*VT.z+VT.ox,-y*VT.z+VT.oy];
const M2=(sx,sy)=>({x:(sx-VT.ox)/VT.z,y:(VT.oy-sy)/VT.z});

function drawMap(){
  if(!W)return;const c=mapX,w=mapC.clientWidth,h=mapC.clientHeight;if(!w)return;
  const z=V.z,ox=w/2-V.cx*z,oy=h/2+V.cy*z;VT={ox,oy,z};
  c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#d9d3c0';c.fillRect(0,0,w,h);
  c.fillStyle='#f6f1e2';c.fillRect(ox,oy-MAP*z,MAP*z,MAP*z);
  c.imageSmoothingEnabled=true;c.drawImage(W.forestCanvas,ox,oy-MAP*z,MAP*z,MAP*z);
  // vegetation symbols
  if(z>0.09){const st=z>0.3?2:z>0.15?3:6;for(let j=0;j<200;j+=st)for(let i=(j/st)%2?Math.floor(st/2):0;i<200;i+=st){const x=i*40+20,y=j*40+20,[p,q]=S2(x,y);if(p<-8||q<-8||p>w+8||q>h+8)continue;const t=W.vegAt(x,y);if(t===2)SYM.orchard(c,p,q);else if(t===3)SYM.paddy(c,p,q);}}
  c.save();c.beginPath();c.rect(ox,oy-MAP*z,MAP*z,MAP*z);c.clip();
  c.setTransform(DPR*z,0,0,-DPR*z,DPR*ox,DPR*oy);
  const xa=Math.floor(clamp((0-ox)/z,0,MAP-1)/1000),xb=Math.floor(clamp((w-ox)/z,0,MAP-1)/1000);
  const ya=Math.floor(clamp((oy-h)/z,0,MAP-1)/1000),yb=Math.floor(clamp(oy/z,0,MAP-1)/1000);
  c.lineCap='round';
  if(z>0.09){c.strokeStyle='#c99a6c';c.lineWidth=0.7/z;c.setLineDash([5/z,4/z]);for(let ty=ya;ty<=yb;ty++)for(let tx=xa;tx<=xb;tx++)c.stroke(W.supp[ty*W.NT+tx]);c.setLineDash([]);}
  c.strokeStyle=z<0.07?'rgba(184,128,80,.55)':'#c08a58';c.lineWidth=(z<0.07?0.6:0.85)/z;
  for(let ty=ya;ty<=yb;ty++)for(let tx=xa;tx<=xb;tx++)c.stroke(W.minor[ty*W.NT+tx]);
  c.strokeStyle='#a05a22';c.lineWidth=(z<0.07?1.1:1.6)/z;

const NET={last:0,status:''};

  netBusy=(async()=>{const left=[];for(const p of outbox()){try{await fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});NET.last=Date.now();}catch(e){left.push(p);}}

/* GET JSON from the score server: fetch first, JSONP fallback (some phones block the cross-site redirect of Apps Script) */
function getJSON(url,ms){ms=ms||12000;
  const viaFetch=()=>Promise.race([fetch(url,{cache:'no-store'}).then(r=>r.json()),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),ms))]);
  const viaScript=()=>new Promise((res,rj)=>{const cb='lnavcb'+Date.now().toString(36)+Math.floor(Math.random()*1e6);const sc=document.createElement('script');let done=false;
    const fin=(v,e)=>{if(done)return;done=true;try{delete window[cb];}catch(x){window[cb]=undefined;}sc.remove();e?rj(e):res(v);};
    window[cb]=v=>fin(v);sc.onerror=()=>fin(null,new Error('jsonp'));setTimeout(()=>fin(null,new Error('timeout')),ms);
    sc.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.head.appendChild(sc);});
  return viaFetch().catch(()=>viaScript());}
async function roomCheck(code,typed){const u=netURL();if(!CFG.web||!u)return;if(ROOM.busy)return;ROOM.busy=true;let j=null;
  for(let k=0;k<2&&!j;k++){try{j=await getJSON(u+(u.includes('?')?'&':'?')+'action=room&code='+encodeURIComponent(code||'')+'&t='+Date.now());}catch(e){j=null;}}
  ROOM.busy=false;
  if(!j||!j.ok){ // offline or server error: keep going only inside a window we already verified
    const s=roomLoad();if(s&&s.status==='open'&&s.code){ROOM.code=s.code;ROOM.info=s;ROOM.off=s.off||0;
      if(!s.close||srvNow()<s.close){if(ROOM.state!=='open'){ROOM.state='open';roomHide();roomMission(s.mission);roomChip();idGate();}roomTick();return;}
      s.status='closed';ROOM.info=s;roomSave(s);roomGate('closed');roomChip();return;}
    if(typed){roomGate('ask',{code,err:'ต่ออินเทอร์เน็ตไม่ได้ ลองอีกครั้ง'});return;}
    if(roomMode()==='on')roomGate('offline');else{roomHide();idGate();roomTick();}return;}
  if(!('status' in j)||j.status==='none'){roomMode('none');ROOM.state='none';ROOM.code='';roomSave(null);roomMission('');roomHide();roomChip();idGate();roomTick();return;}
  roomMode('on');
  if(j.status==='unknown'){ROOM.off=(+j.now||Date.now())-Date.now();if(code&&!typed)roomSave(null);roomMission('');ROOM.state='ask';roomChip();
    roomGate('ask',{code:typed?code:'',err:code?`ไม่พบห้อง "${code}" ตรวจรหัสกับครูฝึกอีกครั้ง`:''});return;}
  roomApply(j);}
function roomTick(){clearInterval(ROOM.t1);clearTimeout(ROOM.t2);const I=ROOM.info||{};
  if(ROOM.state==='notyet'){ROOM.t1=setInterval(()=>{const e=document.getElementById('rgcd');if(e&&I.open)e.textContent=roomLeft(I.open);
      if(I.open&&srvNow()>=I.open-1000){clearInterval(ROOM.t1);roomCheck(ROOM.code);}},1000);
    ROOM.t2=setTimeout(()=>roomCheck(ROOM.code),90000);}
  else if(ROOM.state==='open'){ROOM.t2=setTimeout(()=>roomCheck(ROOM.code),90000);
    if(I.close){const w=I.close-srvNow();if(w<90000)ROOM.t2=setTimeout(()=>{netFlush();roomCheck(ROOM.code);},Math.max(500,w+1500));}}
  else if(ROOM.state==='closed')ROOM.t2=setTimeout(()=>roomCheck(ROOM.code),120000);
  else if(ROOM.state==='none'||ROOM.state==='')ROOM.t2=setTimeout(()=>roomCheck(ROOM.code),120000);}

function routeApply(sp,pins){const keep=(O.lines||[]).filter(L=>!L.route);if(!ROUTE.on||!pins.length){O.lines=keep;return;}
  const pts=[sp,...pins],legs=pts.slice(1).map((p,k)=>({a:{x:pts[k].x,y:pts[k].y},b:{x:p.x,y:p.y},color:'#1f5fbf',route:true,lab:`${k?'หมุด '+k:'SP'} → ${k+1}`}));O.lines=legs.concat(keep);}

function snapPt(m){const cand=[];(O.marks||[]).forEach(k=>cand.push(k));(O.lines||[]).forEach(L=>{cand.push(L.a);cand.push(L.b);});(W?W.landmarks:[]).forEach(l=>cand.push(l));
  let best=m,bd=14/VT.z;for(const k of cand){const d=hyp(k.x-m.x,k.y-m.y);if(d<bd){bd=d;best={x:k.x,y:k.y};}}return{x:best.x,y:best.y};}

/* ---------- map interaction ---------- */
const ptrs=new Map();let G=null;
function relXY(e){const r=mapC.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
mapC.addEventListener('pointerdown',e=>{mapC.setPointerCapture(e.pointerId);const p=relXY(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===1){const m=M2(p.x,p.y);
    if(DRAW.on){const a=snapPt(m);G={type:'draw',sx:p.x,sy:p.y,a,moved:false};}
    else G=insidePlate(m)&&PLOCK.mode!=='all'?{type:'plate',sx:p.x,sy:p.y,px:O.plate.x,py:O.plate.y,moved:false}:{type:'pan',sx:p.x,sy:p.y,cx:V.cx,cy:V.cy,moved:false};}
  else if(ptrs.size===2){O.tmpLine=null;if(G&&G.type==='plate'&&O.plate){O.plate.x=G.px;O.plate.y=G.py;}const[a,b]=[...ptrs.values()];const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};G={type:'pinch',d:hyp(a.x-b.x,a.y-b.y),z:V.z,anchor:M2(mid.x,mid.y),moved:true};}});
mapC.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId)||!G)return;const p=relXY(e);ptrs.set(e.pointerId,p);
  if(G.type==='draw'){if(hyp(p.x-G.sx,p.y-G.sy)>6)G.moved=true;if(G.moved){G.b=snapPt(M2(p.x,p.y));O.tmpLine={a:G.a,b:G.b,color:DRAW.color};requestDraw();}}
  else if(G.type==='plate'){const dx=p.x-G.sx,dy=p.y-G.sy;if(hyp(dx,dy)>6)G.moved=true;if(G.moved&&O.plate){if(PLOCK.mode!=='h')O.plate.x=G.px+dx/V.z;if(PLOCK.mode!=='v')O.plate.y=G.py-dy/V.z;requestDraw();}}
  else if(G.type==='pan'){const dx=p.x-G.sx,dy=p.y-G.sy;if(hyp(dx,dy)>6)G.moved=true;if(G.moved){V.cx=clamp(G.cx-dx/V.z,-600,MAP+600);V.cy=clamp(G.cy+dy/V.z,-600,MAP+600);requestDraw();}}
  else if(G.type==='pinch'&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=hyp(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    V.z=clamp(G.z*d/G.d,fitZoom()*0.9,zMax());const w=mapC.clientWidth,h=mapC.clientHeight;V.cx=G.anchor.x-(mid.x-w/2)/V.z;V.cy=G.anchor.y+(mid.y-h/2)/V.z;requestDraw();}});
function endPtr(e){if(!ptrs.has(e.pointerId))return;const p=relXY(e);const wasTap=G&&G.type!=='pinch'&&!G.moved&&ptrs.size===1;
  if(G&&G.type==='draw'&&G.moved&&G.b&&dist(G.a,G.b)>20){(O.lines||(O.lines=[])).push({a:G.a,b:G.b,color:DRAW.color});}
  O.tmpLine=null;ptrs.delete(e.pointerId);
  if(wasTap&&PIN.on)unitTap(M2(p.x,p.y));
  else if(wasTap&&tapHandler){const m=M2(p.x,p.y);tapHandler(m.x,m.y);}
  if(ptrs.size===1){const q=[...ptrs.values()][0];G={type:'pan',sx:q.x,sy:q.y,cx:V.cx,cy:V.cy,moved:true};}else if(!ptrs.size)G=null;requestDraw();}
mapC.addEventListener('pointerup',endPtr);mapC.addEventListener('pointercancel',endPtr);
mapC.addEventListener('wheel',e=>{e.preventDefault();const p=relXY(e),a=M2(p.x,p.y);V.z=clamp(V.z*Math.exp(-e.deltaY*0.0015),fitZoom()*0.9,zMax());
  const w=mapC.clientWidth,h=mapC.clientHeight;V.cx=a.x-(p.x-w/2)/V.z;V.cy=a.y+(p.y-h/2)/V.z;requestDraw();},{passive:false});

const TYPES={village:'หมู่บ้าน/อาคาร',temple:'วัด',school:'โรงเรียน',hospital:'โรงพยาบาล/สถานพยาบาล',tower:'เสาส่งวิทยุ',bridge:'สะพาน',spot:'จุดระดับความสูง',river:'แม่น้ำ',stream:'ลำห้วย/คลอง',swamp:'หนองน้ำ/บึง',pond:'บ่อน้ำ',road:'ถนนสายหลัก',road3:'ถนนสายรอง',forest:'ป่าไม้',orchard:'สวน/ไร่',paddy:'นาข้าว'};
function vegPoint(t){for(let i=0;i<400;i++){const p=randLand(400);if(W.vegAt(p.x,p.y)===t&&W.vegAt(p.x+80,p.y)===t&&W.vegAt(p.x-80,p.y)===t&&W.roadDist(p.x,p.y)>150)return p;}return null;}
function m1Point(t){
  if(t==='village'){const v=pick(W.villages.filter(v=>!v.small));return v?{x:v.x,y:v.y}:null;}
  if(t==='temple')return W.temple;if(t==='school')return W.school;if(t==='hospital')return W.hospital;
  if(t==='tower')return W.towers.length?pick(W.towers):null;
  if(t==='bridge')return W.bridges.length?pick(W.bridges):null;
  if(t==='spot')return W.peaks.length?pick(W.peaks):null;
  if(t==='pond')return W.ponds.length?pick(W.ponds):null;
  if(t==='river'){const y=rnd(600,7400);return{x:W.riverX(y),y};}
  if(t==='stream'){const s=W.streams.length?pick(W.streams):null;if(!s)return null;const p=s[(s.length*rnd(0.3,0.7))|0];return{x:p[0],y:p[1]};}
  if(t==='swamp')return{x:W.swamp.x,y:W.swamp.y};
  if(t==='road'){for(let i=0;i<50;i++){const rd=pick(W.roads.slice(0,2)),p=pick(rd);if(p[0]>400&&p[1]>400&&p[0]<MAP-400&&p[1]<MAP-400&&W.villages.every(v=>hyp(v.x-p[0],v.y-p[1])>600)&&W.bridges.every(b=>hyp(b.x-p[0],b.y-p[1])>300))return{x:p[0],y:p[1]};}return null;}
  if(t==='road3'){const rd=W.roads[2];if(!rd||rd.length<40)return null;const p=rd[(rd.length*0.5)|0];return{x:p[0],y:p[1]};}
  if(t==='forest')return vegPoint(1);if(t==='orchard')return vegPoint(2);if(t==='paddy')return vegPoint(3);
}
const TERRAIN={peak:'ยอดเขา',ridge:'สันเขา',saddle:'คอเขา',valley:'หุบเขา',cliff:'หน้าผา',depression:'ที่ต่ำ/แอ่ง'};
function terrainPoint(t){if(t==='peak')return W.peaks.length?pick(W.peaks):null;if(t==='ridge')return W.ridges.length?pick(W.ridges):null;if(t==='saddle')return W.saddles.length?pick(W.saddles):null;
  if(t==='valley')return W.valleys.length?pick(W.valleys):null;if(t==='cliff')return W.cliff?{x:W.cliff.x,y:W.cliff.y}:null;if(t==='depression')return W.crater?{x:W.crater.x,y:W.crater.y}:null;}
const CONTOURS={index:'เส้นชั้นความสูงหลัก (Index)',minor:'เส้นชั้นความสูงรอง (Intermediate)',supp:'เส้นชั้นความสูงแทรก (Supplementary)',dep:'เส้นชั้นความสูงคุ้งกระทะ (Depression)'};
/* one mixed set: symbols, contour types, terrain features, elevation */
function mapQuestions(nSym,nCont,nTer,nElev){const qs=[];
  for(const t of shuffle(Object.keys(TYPES))){if(qs.length>=nSym)break;const p=m1Point(t);if(p)qs.push({kind:'sym',t,p,ans:TYPES[t],pool:Object.values(TYPES)});}
  let k=0;for(const t of shuffle(Object.keys(CONTOURS))){if(k>=nCont)break;const a=W.samp[t];if(a&&a.length){qs.push({kind:'cont',t,p:pick(a),ans:CONTOURS[t],pool:Object.values(CONTOURS)});k++;}}
  k=0;for(const t of shuffle(Object.keys(TERRAIN))){if(k>=nTer)break;const p=terrainPoint(t);if(p){qs.push({kind:'ter',t,p,ans:TERRAIN[t],pool:Object.values(TERRAIN)});k++;}}
  for(let i=0;i<nElev;i++){const p=randLand(400),c=Math.round(W.elev(p.x,p.y)/20)*20;const opts=shuffle([c,c-40,c+40,c+(RNG.f()<.5?80:-80)]).map(v=>v+' ม.');qs.push({kind:'elev',p,ans:c+' ม.',opts});}
  qs.forEach(q=>{if(!q.opts)q.opts=shuffle([q.ans,...shuffle(q.pool.filter(v=>v!==q.ans)).slice(0,3)]);});return shuffle(qs);}
const QTEXT={sym:'สิ่งที่อยู่ในวงแดงคืออะไร?',cont:'เส้นชั้นความสูงตรงกลางวงแดงเป็นเส้นประเภทใด?',ter:'ภูมิประเทศตรงวงแดงมีลักษณะเป็นอะไร?',elev:'จุดกลางวงแดงสูงประมาณเท่าไร? (เส้นชั้นความสูงห่าง 20 ม.)'};

const lumErr=az=>angDiff(C.lum,-az+360);
function observeText(x,y){const out=[];const h=W.elev(x,y),g=W.grad(x,y),sl=hyp(g.x,g.y);
  if(sl<0.03)out.push('พื้นค่อนข้างราบ');else out.push(`พื้นลาดลงไปทาง${dir8(Math.atan2(-g.x,-g.y)*180/Math.PI)} (${sl>0.3?'ชันมาก เกือบเป็นหน้าผา':sl>0.15?'ชันมาก':sl>0.07?'ชันปานกลาง':'ลาดเล็กน้อย'})`);
  let top=true;for(let a=0;a<360;a+=45){const r=a*Math.PI/180;if(W.elev(x+Math.sin(r)*120,y+Math.cos(r)*120)>h-1){top=false;break;}}if(top)out.push('อยู่บนยอดเนิน รอบตัวต่ำลงทุกด้าน');
  let low=true;for(let a=0;a<360;a+=45){const r=a*Math.PI/180;if(W.elev(x+Math.sin(r)*90,y+Math.cos(r)*90)<h+1){low=false;break;}}if(low)out.push('อยู่ในแอ่ง รอบตัวสูงขึ้นทุกด้าน');
  const vg=W.vegAt(x,y);out.push(vg===1?'อยู่ในป่า ทัศนวิสัยจำกัด':vg===2?'อยู่ในสวน/ไร่':vg===3?'อยู่ในนาข้าว พื้นที่โล่ง':'พื้นที่โล่ง');
  const rd=Math.abs(x-W.riverX(y));if(rd<150)out.push('ได้ยินเสียงน้ำไหล แม่น้ำอยู่ใกล้มาก');else if(rd<400)out.push('มองเห็นแนวแม่น้ำอยู่ไม่ไกล');
  const sd=W.streamDist(x,y);if(sd<40)out.push('ยืนอยู่ริมลำห้วย');else if(sd<150)out.push('มีลำห้วยอยู่ใกล้ ๆ');
  if(W.inSwamp(x,y)||(((x-W.swamp.x)/(W.swamp.a+250))**2+((y-W.swamp.y)/(W.swamp.b+250))**2<1))out.push('พื้นชื้นแฉะ มีหนองน้ำใกล้ ๆ');
  const rdd=W.roadDist(x,y);if(rdd<25)out.push('ยืนอยู่บนถนน');else if(rdd<200)out.push('เห็นถนนอยู่ใกล้ ๆ');
  if(W.cliff&&hyp(W.cliff.x-x,W.cliff.y-y)<450)out.push('เห็นหน้าผาสูงชันอยู่ใกล้ ๆ');
  for(const v of W.villages)if(hyp(v.x-x,v.y-y)<400){out.push('เห็นบ้านเรือน อยู่ใกล้หมู่บ้าน');break;}
  for(const b of W.bridges)if(hyp(b.x-x,b.y-y)<120){out.push('อยู่ใกล้สะพาน');break;}
  return out;}
function goodStand(minVis){for(let i=0;i<40;i++){const p=randLand(500);const l=computePano(p.x,p.y);if(l.filter(x=>x.vis).length>=minVis)return p;}return null;}

const LEG=[['road','ถนนสายหลัก'],['road3','ถนนสายรอง'],['bridge','สะพาน'],['river','แม่น้ำ'],['stream','ลำห้วย/คลอง'],['marsh','หนองน้ำ/บึง'],['pond','บ่อน้ำ'],['index','เส้นชั้นความสูงหลัก (100 ม.)'],['cont','เส้นชั้นความสูงรอง (20 ม.)'],['supp','เส้นชั้นความสูงแทรก (10 ม.)'],['dep','เส้นชั้นความสูงคุ้งกระทะ'],['cliff','หน้าผา'],['spot','จุดระดับความสูง'],['trig','หมุดสามเหลี่ยม'],['forest','ป่าไม้'],['orchard','สวน/ไร่'],['paddy','นาข้าว'],['building','อาคาร/หมู่บ้าน'],['school','โรงเรียน'],['temple','วัด'],['hospital','โรงพยาบาล'],['tower','เสาส่งวิทยุ'],['geo','กากบาทพิกัดภูมิศาสตร์ (ทุก 1 ลิปดา)']];
function drawLeg(cv,k){const r=Math.min(window.devicePixelRatio||1,2);cv.width=80*r;cv.height=44*r;const c=cv.getContext('2d');c.scale(r*2,r*2);const x=20,y=12;

/* ---------- self-location drill: terrain association + resection with 1, 2 or 3 landmarks ---------- */
function findStand(kind){
  for(let t=0;t<120;t++){let p,linear=null,ldir=0;
    if(kind===1){const useStream=W.streams.length&&RNG.f()<0.4;
      if(useStream){const s=pick(W.streams),i=(s.length*rnd(0.2,0.8))|0;if(!s[i+1])continue;p={x:s[i][0],y:s[i][1]};ldir=Math.atan2(s[i+1][0]-s[i][0],s[i+1][1]-s[i][1])*180/Math.PI;linear='ริมลำห้วย';}

/* ---------- persistence ---------- */
const GS={code:'ALPHA-01',sound:true,db:null,uid:null,writeOK:null,board:null,boardErr:'',tab:'camp'};
function loadLocal(){try{return JSON.parse(localStorage.getItem(CFG.short?'opcompass-s1':'opcompass-v1')||'{}')||{};}catch(e){return{};}}
GS.st=Object.assign({callsign:'',levels:{},so:{}},loadLocal());
try{if(!GS.st.callsign)GS.st.callsign=(localStorage.getItem('lnav-name')||'').slice(0,40);if(!GS.st.sid)GS.st.sid=(localStorage.getItem('lnav-sid')||'').slice(0,20);}catch(e){}
function saveLocal(){try{localStorage.setItem(CFG.short?'opcompass-s1':'opcompass-v1',JSON.stringify(GS.st));}catch(e){}}
let writeChain=Promise.resolve();
function remoteBody(){const so={};Object.keys(GS.st.so).slice(-20).forEach(k=>so[k]=GS.st.so[k]);
  return{callsign:(GS.st.callsign||'').slice(0,40),stars:totalStars(),cleared:cleared(),levels:GS.st.levels,so,at:Date.now()};}
function saveRemote(){if(!GS.db||!GS.uid||GS.writeOK===false)return;const body=remoteBody();
  writeChain=writeChain.then(()=>GS.db.doc('scores/'+GS.uid).set(body)).then(()=>{GS.writeOK=true;},e=>{
    if(e&&e.code==='unavailable')return new Promise(r=>setTimeout(r,800+Math.random()*800)).then(()=>GS.db.doc('scores/'+GS.uid).set(body)).catch(()=>{});
    if(e&&(e.code==='invalid_argument'||e.code==='not_granted'))GS.writeOK=false;});}

/* ---------- progression ---------- */
const RANKS=['นักเรียน','พลทหาร','จ่าอากาศตรี','จ่าอากาศโท','จ่าอากาศเอก','พันจ่าอากาศตรี','พันจ่าอากาศโท','พันจ่าอากาศเอก','เรืออากาศตรี','เรืออากาศโท','เรืออากาศเอก','นาวาอากาศตรี','นาวาอากาศโท'];
const starsOf=s=>s>=95?3:s>=80?2:s>=60?1:0;
const cleared=()=>LEVELS.filter(l=>(GS.st.levels[l.id]||0)>=60).length;

function badge(r,size){size=size||30;const off=r>=8;r=Math.min(r,7);let inner='';
  if(off)inner='<path d="M15 8l2 4.3 4.7.5-3.5 3.2 1 4.6-4.2-2.4-4.2 2.4 1-4.6-3.5-3.2 4.7-.5z" fill="#f0b03a"/>';
  else for(let k=0;k<Math.min(r,4);k++){const y=19-k*4.2;inner+=`<path d="M8.5 ${y}l6.5-4 6.5 4" fill="none" stroke="#f0b03a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;}
  if(r>4&&!off)inner+=`<circle cx="15" cy="23.5" r="1.8" fill="#f0b03a"/>`;
  return`<svg width="${size}" height="${size}" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 2l11 4v8c0 7-5 11.5-11 14C9 25.5 4 21 4 14V6z" fill="#26301f" stroke="#4d5c44" stroke-width="1.2"/>${inner}</svg>`;}
const starStr=n=>'★'.repeat(n)+`<i>${'★'.repeat(3-n)}</i>`;
function renderRankChip(){const r=cleared();$('#rankchip').innerHTML=`${badge(r,26)}<b>${RANKS[r]}</b><span class="st">★ ${totalStars()}/${LEVELS.length*3}</span>`;}

/* ---------- sound & flash ---------- */
let AC=null;
function tone(f,t0,d,type,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,AC.currentTime+t0);g.gain.linearRampToValueAtTime(vol||.12,AC.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t0+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+d+.05);}
function sfx(k){if(!GS.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  if(k==='ok'){tone(880,0,.12,'triangle');tone(1320,.08,.16,'triangle');}
  else if(k==='bad'){tone(160,0,.25,'sawtooth',.08);}
  else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.22,'triangle'));}
  else if(k==='tick'){tone(1500,0,.04,'square',.04);}}catch(e){}}
function flash(ok){const f=$('#flash');f.className='flash '+(ok?'ok':'bad');setTimeout(()=>f.className='flash',350);sfx(ok?'ok':'bad');}
$('#snd').onclick=()=>{GS.sound=!GS.sound;$('#snd').setAttribute('aria-pressed',GS.sound);$('#sndwave').style.opacity=GS.sound?1:.15;};

/* ---------- timer ---------- */
let TM=null;
function startTimer(sec,onEnd){stopTimer();const t0=performance.now();const left=()=>Math.max(0,sec-(performance.now()-t0)/1000);
  TM=setInterval(()=>{const l=left(),b=$('#tbar');if(b){b.firstElementChild.style.width=(l/sec*100)+'%';b.classList.toggle('low',l<sec*0.2);}const t=$('#tleft');if(t)t.textContent=Math.ceil(l)+' วิ';if(l<=0){stopTimer();onEnd();}},200);return left;}
function stopTimer(){if(TM){clearInterval(TM);TM=null;}}
const hud=(name,timed)=>`<div class="hud"><span class="lvl">${esc(name)}</span><span class="combo" id="combo"></span>${timed?'<span class="mono muted" id="tleft"></span>':''}<span class="pts" id="pts">0</span></div>${timed?'<div class="tbar" id="tbar"><span style="width:100%"></span></div>':'<div style="height:8px"></div>'}`;
function setPts(p,combo){const e=$('#pts');if(e)e.textContent=Math.round(p);const c=$('#combo');if(c)c.textContent=combo>=3?`คอมโบ ×${combo}`:'';}

/* ---------- levels ---------- */
function levelSession(idx){let done=false;const S={pts:0,combo:0,idx,
  hit(p){S.pts+=p;S.combo++;if(S.combo>=3)S.pts+=2;flash(true);setPts(S.pts,S.combo);},
  miss(){S.combo=0;flash(false);setPts(S.pts,0);},
  end(bonus){if(done)return;done=true;S.over=true;stopTimer();tapHandler=null;setStageView('map',false);finishLevel(idx,S.pts+(bonus||0),S.extra||'');}};return S;}
function finishLevel(idx,raw,extra){const L=LEVELS[idx],score=clamp(Math.round(raw),0,100),stars=starsOf(score);
  const prevBest=GS.st.levels[L.id]||0,prevRank=cleared();if(score>prevBest)GS.st.levels[L.id]=score;saveLocal();
  const nowRank=cleared(),promoted=nowRank>prevRank;renderRankChip();saveRemote();gameSubmit();sfx(stars?'win':'bad');
  const next=idx+1<LEVELS.length&&unlocked(idx+1);
  setSheet(`<div class="result"><div class="eyebrow">ภารกิจ ${idx+1} · ${esc(L.name)}</div>
    <div class="bigstars">${[0,1,2].map(k=>k<stars?'<b>★</b>':'<i>★</i>').join('')}</div>
    <div class="score mono">${score}<span class="muted" style="font-size:18px"> / 100</span></div>
    <p class="muted">${stars?(score>prevBest&&prevBest?'ทำลายสถิติเดิม ('+prevBest+')':'สถิติดีที่สุด '+Math.max(score,prevBest)):'ต้องได้ 60 คะแนนขึ้นไปจึงผ่านภารกิจ'}</p>

  tapHandler=(x,y)=>{if(!N.pinMode||N.done)return;N.pins.push({x,y});ui(`ปักหมุด ${N.pins.length} ที่ ${gridRef(x,y,8)} · ใช้ปุ่มลูกศรมุมซ้ายล่างเลื่อนหมุดล่าสุดได้`);};

  const aimOf=(pp,az,cnt)=>{if(cfg.mode==='patrol'){const k=nextIdx();return k>=0?tg[k]:null;}const a=(az+W.gmDeg)*Math.PI/180,e={x:pp.x+Math.sin(a)*cnt,y:pp.y+Math.cos(a)*cnt};let b=null,bd=1e9;tg.forEach((c,k)=>{if(N.found.has(k))return;const d=dist(e,c);if(d<bd){bd=d;b=c;}});return b;};
  function walk(){const az=num('laz'),P=num('ld');if(isNaN(az)||isNaN(P)||P<=0)return ui('กรอกมุมภาคและจำนวนก้าวก่อนเดิน');const Dm=Math.min(P*100/140,3000);N.endArm=false;
    const legErr=gauss()*0.5,scale=N.stride*(1+gauss()*0.015);let hdg=wrap360(az)+W.gmDeg+legErr,x=N.tp.x,y=N.tp.y,cnt=0,act=0,stop='',wet=false;
    while(cnt<Dm){const step=Math.min(10,Dm-cnt);hdg+=gauss()*(W.isForest(x,y)?0.2:0.1);const a=hdg*Math.PI/180,h1=W.elev(x,y),sl=(W.elev(x+Math.sin(a)*step,y+Math.cos(a)*step)-h1)/step,f=scale;
      const mx=x+Math.sin(a)*step*f,my=y+Math.cos(a)*step*f;if(mx<0||my<0||mx>MAP||my>MAP){stop='ถึงขอบพื้นที่';break;}

    N.log.push(`เดิน ${fd(az)}° นับได้ ${pc} ก้าว${wet?' (ลุยข้ามน้ำ)':''}${stop?' — '+stop:''}`);if(stop)sfx('bad');ui(stop?`<b>${stop}</b> หลังนับได้ ${pc} ก้าว`:`เดินครบ ${pc} ก้าว${wet?' · ลุยข้ามน้ำระหว่างทาง':''}`);}

function navStart(){for(let i=0;i<80;i++){const p=randLand(900);if(W.roadDist(p.x,p.y)<60)return p;}return randLand(900);}
function runL8(S,L){const sp=navStart();const tg=[];let prev=sp;for(let k=0;k<2;k++){let c=null;for(let i=0;i<300&&!c;i++){const a=rnd(0,6.283),d=rnd(700,1200),p={x:prev.x+Math.sin(a)*d,y:prev.y+Math.cos(a)*d};if(landOK(p.x,p.y)&&p.x>500&&p.y>500&&p.x<MAP-500&&p.y<MAP-500&&dist(p,sp)>500)c=p;}c=c||randLand(600);tg.push({...c,label:'CP'+(k+1),pts:40});prev=c;}
  const par=(dist(sp,tg[0])+dist(tg[0],tg[1]))/1000*15*1.3;
  runNav({title:`ภารกิจ ${S.idx+1} · ${L.name}`,mode:'patrol',start:sp,targets:tg,onEnd:r=>{const bonus=r.found===2?Math.round(20*clamp(par/Math.max(r.time,1),0,1)):0;S.pts=45*r.found+Math.round(bonus/2)-3*r.wrong;S.extra=`<p class="muted" style="font-size:13.5px">พบ ${r.found}/2 จุดตรวจ (จุดละ 45) · ค้นหาผิดที่ ${r.wrong} ครั้ง (ครั้งละ −3) · พบเมื่ออยู่ห่างจุดตรวจไม่เกิน ${TOL.find} ม. · เส้นแดง = ทางที่เดินจริง · เส้นประ = ทางที่คิดว่าเดิน</p>`+r.review;S.end(0);}});}

    <p><b>รหัสภารกิจ</b> ใช้สร้างพื้นที่ ครูฝึกประกาศรหัสเดียวกันให้ทุกคนแข่งบนแผนที่เดียวกัน</p>
    <h3>มุมภาค</h3>${declHTML()}
    <h3>สัญลักษณ์แผนที่</h3><div class="legend">${LEG.map(([k,t])=>`<div><canvas data-k="${k}" aria-hidden="true"></canvas><span>${t}</span></div>`).join('')}</div>
    <h3>สูตรลัด</h3><ul style="padding-left:20px;font-size:14px"><li>มุมกลับ: น้อยกว่า 180° บวก 180° · มากกว่าหรือเท่ากับ 180° ลบ 180°</li><li>1 ช่องกริด = 1 กม. · พิกัด 6 หลัก = 100 ม. · 8 หลัก = 10 ม.</li><li>คลาด 1° ≈ ออกทิศ 17 ม. ต่อระยะ 1 กม.</li></ul>`);
  sheet.querySelectorAll('.legend canvas').forEach(cv=>drawLeg(cv,cv.dataset.k));}

const TABS=[['camp','แคมเปญ',showCampaign],['so','Score-O',showScoreO],['lb','ส่งคะแนน/อันดับ',showBoard],['help','วิธีเล่น',showHelp]];
function setTab(t){GS.tab=t;$('#tabs').innerHTML=TABS.map(([id,n])=>`<button class="tab" role="tab" data-t="${id}" aria-selected="${id===t}">${n}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.t));(TABS.find(x=>x[0]===t)||TABS[0])[2]();requestDraw();}
function regen(){const c=($('#code').value||'ALPHA-01').trim().toUpperCase().replace(/[^A-Z0-9\-]/g,'')||'ALPHA-01';$('#code').value=c;GS.code=c;try{localStorage.setItem('opcompass-code',c);}catch(e){}genWorld(c);fitView();setTab(GS.tab==='lb'||GS.tab==='help'?GS.tab:GS.tab==='so'?'so':'camp');}
$('#gen').onclick=regen;$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')regen();});

/* ---------- boot ---------- */
try{const c=localStorage.getItem('opcompass-code');if(c)$('#code').value=c;}catch(e){}
new ResizeObserver(resize).observe($('#stage'));window.addEventListener('resize',resize);
resize();renderRankChip();regen();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>requestDraw());
(async()=>{try{if(!window.claude||!window.claude.use)return;const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db)return;GS.db=db;
  GS.uid=user?await user.id():null;
  db.collection('scores').limit(500).onSnapshot(snap=>{GS.board=snap.docs.map(d=>({id:d.id,...d.data()}));renderBoard();},e=>{GS.boardErr=e&&e.code||'error';});
  if(GS.tab==='lb')showBoard();}catch(e){}})();

})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
